    <div style="margin-top:6px;padding:6px 8px;border:1px solid ${mt ? 'var(--amber-border)' : 'var(--emerald-border)'};background:${mt ? 'var(--amber-bg)' : 'var(--emerald-bg)'};border-radius:3px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <span style="font-size:10px;color:${mt ? 'var(--amber)' : 'var(--emerald)'}">💵 货币环境: ${mt ? '紧缩(Fed鹰派)→ 否决多头' : '中性/宽松 → 放行'}</span>
        ${anchorLine}
      </div>
      <button onclick="toggleMonetary()" style="font-size:9px;padding:2px 8px;border:1px solid var(--border);border-radius:3px;color:var(--text-dim);flex-shrink:0">切换</button>
    </div>${staleLine}`;
  const gateBlock = !sc.gatePassed
    ? `<div style="margin-top:6px;padding:6px 8px;border:1px solid var(--rose-border);background:var(--rose-bg);border-radius:3px;font-size:10px;color:var(--rose)">🛑 总闸未开(价格或货币因子未通过)：最多试探仓25%，不许重仓</div>`
    : `<div style="margin-top:6px;padding:6px 8px;border:1px solid var(--emerald-border);background:var(--emerald-bg);border-radius:3px;font-size:10px;color:var(--emerald)">✅ 总闸已开：可按打分执行仓位</div>`;

  // Capped position if gate not passed OR monetary tight
  let effPos = rule.pos;
  const hardCap = !sc.gatePassed || mt;
  if (hardCap && rule.pos && parseInt(rule.pos) > 25) effPos = '25% (总闸未开/货币紧缩·封顶)';

  const groupsHtml = cl.groups.map((g, gi) => `
    <div style="margin-top:12px">
      <div style="font-size:11px;letter-spacing:0.05em;color:var(--text-dim);margin-bottom:6px;font-weight:600">${escapeHtml(g.name)}</div>
      ${g.items.map((it, ii) => {
        const autoTag = it.auto ? '<span style="font-size:8px;color:var(--cyan);border:1px solid var(--cyan-border);padding:0 3px;border-radius:2px;margin-left:4px">自动</span>' : '';
        const gateTag = it.gate ? '<span style="font-size:8px;color:var(--amber);border:1px solid var(--amber-border);padding:0 3px;border-radius:2px;margin-left:4px">总闸</span>' : '';
        const trackTag = it.noScore ? '<span style="font-size:8px;color:var(--text-faint);border:1px solid var(--border);padding:0 3px;border-radius:2px;margin-left:4px">追踪</span>' : '';
        if (edit) {
          return `<div style="display:flex;gap:6px;align-items:center;padding:4px 0">
            <input value="${escapeHtml(it.text)}" onchange="editChecklistItem(${gi},${ii},this.value)"
              style="flex:1;background:var(--bg-panel);border:1px solid var(--border);color:var(--text);font:inherit;font-size:11px;padding:4px 6px;border-radius:3px"/>
            <button onclick="removeChecklistItem(${gi},${ii})" style="color:var(--rose);padding:2px 6px">✕</button>
          </div>`;
        }
        return `<button onclick="toggleChecklistItem(${gi},${ii})" ${it.auto ? 'disabled' : ''}
          style="display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:6px 8px;margin-bottom:3px;border:1px solid ${it.checked ? 'var(--emerald-border)' : 'var(--border)'};background:${it.checked ? 'var(--emerald-bg)' : 'transparent'};border-radius:3px;${it.auto ? 'opacity:0.85;cursor:default' : 'cursor:pointer'}">
          <span style="flex-shrink:0;width:16px;height:16px;border:1.5px solid ${it.checked ? 'var(--emerald)' : 'var(--text-faint)'};border-radius:3px;display:inline-flex;align-items:center;justify-content:center;color:var(--emerald);font-size:11px;margin-top:1px">${it.checked ? '✓' : ''}</span>
          <span style="flex:1">
            <span style="font-size:11px;color:${it.checked ? 'var(--text)' : 'var(--text-dim)'}">${escapeHtml(it.text)}${autoTag}${gateTag}${trackTag}</span>
            ${it.hint ? `<br><span style="font-size:9px;color:var(--text-faint)">${escapeHtml(it.hint)}</span>` : ''}
          </span>
        </button>`;
      }).join('')}
      ${edit ? `<button onclick="addChecklistItem(${gi})" style="font-size:10px;color:var(--cyan);padding:4px">+ 加一项</button>` : ''}
    </div>
  `).join('');

  const rulesHtml = cl.actionRules.map((r, ri) => {
    const active = sc.rule && sc.rule.min === r.min;
    if (edit) {
      return `<div style="display:flex;gap:4px;align-items:center;padding:3px 0;font-size:10px">
        <input type="number" value="${r.min}" onchange="editRule(${ri},'min',this.value)" style="width:34px;background:var(--bg-panel);border:1px solid var(--border);color:var(--text);font:inherit;font-size:10px;padding:2px;border-radius:2px"/>
        <span>-</span>
        <input type="number" value="${r.max}" onchange="editRule(${ri},'max',this.value)" style="width:34px;background:var(--bg-panel);border:1px solid var(--border);color:var(--text);font:inherit;font-size:10px;padding:2px;border-radius:2px"/>
        <input value="${escapeHtml(r.action)}" onchange="editRule(${ri},'action',this.value)" style="flex:1;background:var(--bg-panel);border:1px solid var(--border);color:var(--text);font:inherit;font-size:10px;padding:2px 4px;border-radius:2px"/>
        <input value="${escapeHtml(r.pos)}" onchange="editRule(${ri},'pos',this.value)" style="width:48px;background:var(--bg-panel);border:1px solid var(--border);color:var(--text);font:inherit;font-size:10px;padding:2px;border-radius:2px"/>
      </div>`;
    }
    return `<div style="display:flex;justify-content:space-between;padding:4px 8px;border-radius:2px;font-size:10px;${active ? 'background:var(--emerald-bg);border:1px solid var(--emerald-border)' : ''}">
      <span style="color:var(--text-dim)">${r.min}-${r.max}分 · ${escapeHtml(r.label)}</span>
      <span style="color:${active ? 'var(--emerald)' : 'var(--text-mute)'}">${escapeHtml(r.action)} · <strong>${escapeHtml(r.pos)}</strong></span>
    </div>`;
  }).join('');

  const failHtml = cl.failConditions.map((f, fi) => {
    if (edit) {
      return `<div style="display:flex;gap:6px;align-items:center;padding:3px 0">
        <input value="${escapeHtml(f)}" onchange="editFail(${fi},this.value)" style="flex:1;background:var(--bg-panel);border:1px solid var(--border);color:var(--text);font:inherit;font-size:10px;padding:3px 5px;border-radius:2px"/>
        <button onclick="removeFail(${fi})" style="color:var(--rose);padding:2px 6px">✕</button>
      </div>`;
    }
    return `<div style="font-size:10px;color:var(--rose);padding:2px 0">🔴 ${escapeHtml(f)}</div>`;
  }).join('');

  const pct = sc.total ? Math.round(sc.checked / sc.total * 100) : 0;

  return `
    <div style="padding:0">
      <!-- Header / score gauge -->
      <div style="padding:12px;border-bottom:1px solid var(--border-light)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="font-size:12px;font-weight:600;color:var(--text)">${escapeHtml(cl.title)}</div>
          <button onclick="toggleChecklistEdit()" style="font-size:10px;padding:3px 8px;border:1px solid var(--border);border-radius:3px;color:${edit ? 'var(--emerald)' : 'var(--text-dim)'}">${edit ? '完成' : '编辑'}</button>
        </div>
        <div style="font-size:9px;color:var(--text-faint);margin-bottom:8px">更新: ${edit ? `<input value="${escapeHtml(cl.updated)}" onchange="editChecklistMeta('updated',this.value)" style="background:var(--bg-panel);border:1px solid var(--border);color:var(--text);font:inherit;font-size:9px;padding:1px 4px;border-radius:2px;width:90px"/>` : escapeHtml(cl.updated)}</div>
        ${edit ? `<input value="${escapeHtml(cl.title)}" onchange="editChecklistMeta('title',this.value)" style="width:100%;background:var(--bg-panel);border:1px solid var(--border);color:var(--text);font:inherit;font-size:11px;padding:4px 6px;border-radius:3px;margin-bottom:8px" placeholder="清单标题"/>` : ''}
        <!-- Score bar -->
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px">
          <span style="font-size:24px;font-weight:700;color:${sc.checked >= 7 ? 'var(--emerald)' : sc.checked >= 5 ? 'var(--cyan)' : sc.checked >= 3 ? 'var(--amber)' : 'var(--rose)'}">${sc.checked}</span>
          <span style="font-size:12px;color:var(--text-faint)">/ ${sc.total} 信号</span>
        </div>
        <div style="height:6px;background:var(--bg-panel);border-radius:3px;overflow:hidden;margin-bottom:8px">
          <div style="height:100%;width:${pct}%;background:${sc.checked >= 7 ? 'var(--emerald)' : sc.checked >= 5 ? 'var(--cyan)' : sc.checked >= 3 ? 'var(--amber)' : 'var(--rose)'};transition:width 0.3s"></div>
        </div>
        <!-- Current action -->
        <div style="padding:8px;border:1px solid var(--border);border-radius:4px;background:var(--bg-panel)">
          <div style="font-size:10px;color:var(--text-faint)">当前状态</div>
          <div style="font-size:13px;font-weight:600;color:var(--text);margin:2px 0">${escapeHtml(rule.label)}</div>
          <div style="font-size:11px;color:var(--text-dim)">行动: ${escapeHtml(rule.action)} · 仓位: <strong style="color:var(--emerald)">${escapeHtml(effPos)}</strong></div>
        </div>
        ${gateBlock}
        ${monetaryToggle}
      </div>

      <!-- Signal groups -->
      <div style="padding:0 12px 12px">
        ${groupsHtml}
        ${edit ? `<button onclick="addChecklistGroup()" style="font-size:10px;color:var(--cyan);padding:6px;margin-top:8px;border:1px dashed var(--border);border-radius:3px;width:100%">+ 加一组</button>` : ''}

        <!-- Action rules -->
        <div style="margin-top:16px">
          <div style="font-size:11px;letter-spacing:0.05em;color:var(--text-dim);margin-bottom:6px;font-weight:600">📊 打分→行动规则</div>
          ${rulesHtml}
        </div>

        <!-- Fail conditions -->
        <div style="margin-top:16px">
          <div style="font-size:11px;letter-spacing:0.05em;color:var(--text-dim);margin-bottom:6px;font-weight:600">🚫 失效条件 (任一触发→清仓回现金)</div>
          ${failHtml}
          ${edit ? `<button onclick="addFail()" style="font-size:10px;color:var(--cyan);padding:4px">+ 加一条</button>` : ''}
        </div>

        <!-- Reset -->
        <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border-light)">
          <button onclick="resetChecklist()" style="font-size:10px;color:var(--text-faint);padding:6px">↺ 恢复默认清单</button>
          <button onclick="uncheckAllChecklist()" style="font-size:10px;color:var(--text-faint);padding:6px;margin-left:8px">清空所有勾选</button>
        </div>
        <div style="margin-top:8px;font-size:9px;color:var(--text-faint);line-height:1.5">
          🛑总闸项(regime)由扫描自动检测，下跌趋势时无法重仓。地缘/技术项需你手动勾。点"编辑"可改信号、阈值、规则——形势变了随时调。
        </div>
      </div>
    </div>
  `;
}

// v6.0: 云端数据读不到时的统一说明
function cloudMissingNote(what) {
  if (!location.protocol.startsWith('http')) return `<div class="empty">${what}来自云端。当前是直接打开的本地文件,读不到云端数据;请从App的网址打开。同样的内容也在定时邮件里。</div>`;
  if (!state.cloudTried) return `<div class="empty">正在读取云端数据…</div>`;
  return `<div class="empty">没读到${what}。可能云端还没运行过,或网页托管没有开启。同样的内容也在定时邮件里。</div>`;
}
// v6.0: 盯盘页 —— 价位、持仓、主流币衍生品
function renderBoardTab() {
  if (!state.cloudCfg) return cloudMissingNote('盯盘配置');
  if (!state.tokens.length) return `<div class="empty">等扫描完成…</div>`;
  const b = buildBoard();
  const d = derivsFresh();
  const cls = (v) => (v >= 0 ? 'up' : 'down');
  let html = `<div class="sec-title">关键价位</div>`;
  html += b.levels.length ? `<table class="qt"><tr><th>标的</th><th>条件</th><th>现价</th><th>距离</th></tr>${b.levels.map(L => `
    <tr class="${L.hit ? 'hit' : ''}"><td><b>${L.s}</b></td><td>${L.dir === 'below' ? '跌破' : '站上'} $${fmtPrice(L.price)}<div class="qt-note">${escapeHtml(L.note)}</div></td>
    <td>$${fmtPrice(L.p)}</td><td>${L.hit ? '<span class="amber">已触发</span>' : fmtPct(L.dist)}</td></tr>`).join('')}</table>` : `<div class="empty">没有设置价位</div>`;
  html += `<div class="sec-title">持仓</div>`;
  html += b.positions.length ? `<table class="qt"><tr><th>标的</th><th>入场→现价</th><th>盈亏</th><th>止损 / 目标</th></tr>${b.positions.map(P => `
    <tr><td><b>${P.s}</b> ${P.side === 'long' ? '多' : '空'}${P.lev > 1 ? ' ' + P.lev + 'x' : ''}<div class="qt-note">${escapeHtml(P.tags.join(' '))}</div></td>
    <td>$${fmtPrice(P.entry)} → $${fmtPrice(P.p)}</td><td class="${cls(P.pnl)}">${fmtPct(P.pnl)}</td>
    <td>${P.stop ? '$' + fmtPrice(P.stop) : '—'} / ${P.target ? '$' + fmtPrice(P.target) : '—'}</td></tr>`).join('')}</table>`
    : `<div class="qt-hint">没有登记持仓。登记后,触及止损/目标、或持仓币出现急跌、跑输大盘、顶部被拒等标记时会推送。</div>`;
  html += `<div class="sec-title">主流币 · 衍生品${d ? `<span class="sec-sub">${new Date(d.time).toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' })}</span>` : ''}</div>`;
  html += `<table class="qt"><tr><th>标的</th><th>7日低 / 高</th><th>费率/8h</th><th>持仓量(24h)</th><th>多空比</th></tr>${b.majors.map(m => `
    <tr><td><b>${m.s}</b><div class="qt-note ${cls(m.c24)}">${fmtPct(m.c24)}</div></td><td>$${fmtPrice(m.l7)}<br>$${fmtPrice(m.h7)}</td>
    <td class="${m.fr == null ? '' : cls(m.fr)}">${fmtFr(m.fr)}<div class="qt-note">年化 ${fmtFrAnn(m.fr)}</div></td>
    <td>${m.oi ? '$' + fmtVolume(m.oi) : '—'}<div class="qt-note">${m.dOi24 == null ? '' : fmtPct(m.dOi24)}</div></td><td>${m.ls == null ? '—' : m.ls.toFixed(2)}</td></tr>`).join('')}</table>`;
  if (!d) html += `<div class="qt-hint">衍生品数据暂时没有(云端3小时内没有成功抓取)。</div>`;
  html += `<div class="qt-hint">价位和持仓写在云端配置 cloud/config.json 里,云端和App共用这一份;改动后下次定时运行生效。7日新高/新低对上面的主流币、设了价位的币和持仓币自动提醒。</div>`;
  return html;
}
// v6.0: 战绩页 —— 信号账本的统计
function renderStatsTab() {
  const L = state.ledger;
  if (!L) return cloudMissingNote('信号账本');
  const H = L.horizons || [1, 3, 7, 14];
  const table = L.seg?.[state.statSeg]?.[state.statH] || {};
  const typeName = { long: '多头标记', avoid: '回避标记', short: '偏空标记' };
  const row = (label, r, bold) => `<tr class="${r.n < 20 ? 'thin' : ''}"><td>${bold ? '<b>' + label + '</b>' : label}</td><td>${r.n}</td><td>${r.win}%</td><td class="${r.avg >= 0 ? 'up' : 'down'}">${fmtPct(r.avg)}</td><td class="${r.ex >= 0 ? 'up' : 'down'}">${fmtPct(r.ex)}</td></tr>`;
  let body = '';
  ['long', 'avoid', 'short'].forEach(ty => {
    const agg = table['_' + ty];
    if (!agg) return;
    body += row(typeName[ty] + '(合计)', agg, true);
    Object.entries(table).filter(([c]) => !c.startsWith('_') && L.types?.[c]?.type === ty).sort((a, b) => b[1].n - a[1].n)
      .forEach(([c, r]) => { body += row('　' + escapeHtml(L.types[c].name || c), r, false); });
  });
  const since = L.since ? new Date(L.since).toLocaleDateString('zh-CN') : '—';
  return `
    <div class="filters"><div class="sort-row">
      ${H.map(h => `<button class="chip-sort ${state.statH === h ? 'active' : ''}" onclick="setStat('statH', ${h})">${h}天后</button>`).join('')}
    </div><div class="sort-row" style="margin-top:6px">
      ${[['all', '全部'], ['top50', '成交量前50'], ['rest', '50名以后']].map(([k, n]) => `<button class="chip-sort ${state.statSeg === k ? 'active' : ''}" onclick="setStat('statSeg', '${k}')">${n}</button>`).join('')}
    </div></div>
    ${body ? `<table class="qt"><tr><th>标记</th><th>样本</th><th>正确率</th><th>平均涨跌</th><th>相对BTC</th></tr>${body}</table>`
      : `<div class="empty">这个期限还没有到期的记录。账本从 ${since} 开始记,${state.statH}天期的结果最早要 ${state.statH} 天后才有。</div>`}
    <div class="qt-hint">
      账本自 ${since} 起,共记 ${L.entries} 条(其中 ${L.init} 条是建档时市场上已有的标记),${L.pending} 条尚未全部到期。<br>
      <b>正确率</b>按相对BTC算:多头标记跑赢BTC算对,回避/偏空标记跑输BTC算对。50%等于抛硬币。<br>
      <b>样本少于20的行是灰色的</b>,不足以下结论。这是往前记的账,不是回测:记下时不知道结果。
    </div>
    ${(L.recent || []).length ? `<div class="sec-title">最近到期(1天)</div><table class="qt"><tr><th>标的</th><th>标记</th><th>记录时</th><th>1天后</th><th>相对BTC</th></tr>${L.recent.slice(0, 20).map(e => `
      <tr><td><b>${e.s}</b></td><td>${escapeHtml(L.types?.[e.c]?.name || e.c)}</td><td>$${fmtPrice(e.p)}</td><td class="${e.ret >= 0 ? 'up' : 'down'}">${fmtPct(e.ret)}</td><td class="${e.ex >= 0 ? 'up' : 'down'}">${fmtPct(e.ex)}</td></tr>`).join('')}</table>` : ''}
  `;
}

// v5.4: 消息列表
function renderMessagesTab() {
  const msgs = allMessages();
  const ns = notifyState();
  const nsText = { granted: '系统通知:已开启', denied: '系统通知:已被拒绝,需到手机"设置 → 应用 → Edge → 通知"里打开', default: '系统通知:未开启', unsupported: '系统通知:当前浏览器不支持' }[ns];
  const when = (iso) => new Date(iso).toLocaleString('zh-CN', { hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  return `
    <div class="msg-head">
      <div class="msg-notify">${nsText}${ns === 'default' ? ` <button class="chip-sort active" onclick="enableNotify()">开启</button>` : ''}${ns === 'granted' ? ` <button class="chip-sort" onclick="testNotify()">测试</button>` : ''}</div>
      <div class="msg-note">App开着或刚切到后台时会弹通知;被系统关掉后收不到,那时看邮件。</div>
      ${state.localMsgs.length ? `<button class="chip-sort" onclick="clearLocalMessages()">清空本机消息</button>` : ''}
    </div>
    ${msgs.length === 0 ? `<div class="empty">还没有消息。云端每小时扫描一次,触发提醒或到简报时间会出现在这里;本机扫描发现的提醒也会记在这里。</div>` : ''}
    ${msgs.map(m => `
      <div class="msg-card ${m.kind === 'alert' ? 'alert' : ''}">
        <div class="msg-meta"><span>${m.src === 'cloud' ? '☁ 云端' : '📱 本机'} · ${when(m.time)}</span><span>${m.kind === 'alert' ? '提醒' : '简报'}</span></div>
        <div class="msg-title">${escapeHtml(m.title)}</div>
        ${(m.lines || []).map(l => `<div class="msg-line">${escapeHtml(l)}</div>`).join('')}
      </div>`).join('')}
  `;
}

function render() {
  const errorHtml = state.error ? `<div class="error-banner">${ICONS.alert}<span>${escapeHtml(state.error)}</span></div>` : '';
  let content = '';
  if (state.tab === 'scan') content = renderScanTab();
  else if (state.tab === 'report') content = renderReportTab();
  else if (state.tab === 'checklist') content = renderChecklistTab();
  else if (state.tab === 'history') content = renderHistoryTab();
  else if (state.tab === 'help') content = renderHelpTab();
  else if (state.tab === 'messages') content = renderMessagesTab();
  else if (state.tab === 'board') content = renderBoardTab();
  else if (state.tab === 'stats') content = renderStatsTab();

  document.getElementById('app').innerHTML = renderHeader() + errorHtml + content;
}

/* ============== EVENT HANDLERS (exposed to window) ============== */
window.setTab = (tab) => { state.tab = tab; state.historyDetail = null; state.showCloud = false; if (tab === 'messages') markMessagesRead(); render(); };
window.setFilter = (f) => { state.filter = f; render(); };
window.setSort = (s) => { state.sortBy = s; render(); };
window.toggleExpand = (sym) => { state.expanded = state.expanded === sym ? null : sym; render(); };
window.toggleWatch = (sym) => toggleWatch(sym);
window.performScan = performScan;
window.setAutoRefresh = setAutoRefresh;
window.setAutoMin = setAutoMin;
window.setPool = setPool;
window.setStat = (k, v) => { state[k] = v; render(); };
window.enableNotify = async () => {
  try { await Notification.requestPermission(); } catch {}
  render();
  if (notifyState() === 'granted') systemNotify({ title: 'QUANT 通知已开启', lines: ['有新提醒时会在这里弹出'], kind: 'test' });
};
window.testNotify = () => {
  const m = { title: 'QUANT 测试通知', lines: ['如果你在通知栏看到这条,说明系统通知可用'], kind: 'test', src: 'local' };
  showToast(m, '测试'); systemNotify(m);
};
window.clearLocalMessages = () => {
  if (!confirm('清空本机产生的消息?云端消息不受影响。')) return;
  state.localMsgs = []; lsSet('qs_messages', []); render();
};
window.viewCloudReport = () => { state.showCloud = true; state.tab = 'report'; state.historyDetail = null; render(); };
window.hideCloudReport = () => { state.showCloud = false; render(); };
window.copyReport = copyReport;
window.downloadReport = downloadReport;
window.openHistoryDetail = (key) => {
  const data = loadScan(key);
  if (data) { state.historyDetail = data; render(); }
};
window.closeHistoryDetail = () => { state.historyDetail = null; render(); };
window.deleteScanItem = (key) => {
  if (!confirm('删除这条扫描记录？')) return;
  deleteScan(key);
  if (state.historyDetail?.timestamp && ('qs_scan_' + state.historyDetail.timestamp) === key) {
    state.historyDetail = null;
  }
  render();
};

/* ===== Checklist handlers ===== */
window.toggleChecklistItem = (gi, ii) => {
  const it = state.checklist.groups[gi].items[ii];
  if (it.auto) return; // auto items can't be manually toggled
  it.checked = !it.checked;
  saveChecklist(); render();
};
window.toggleChecklistEdit = () => { state.checklistEdit = !state.checklistEdit; render(); };
window.toggleMonetary = () => {
  state.monetaryTight = !state.monetaryTight;
  try { localStorage.setItem('qs_monetary_tight', JSON.stringify(state.monetaryTight)); } catch {}
  // v5.0: 关闸 → 记起算点(日期+当时BTC);开闸 → 清掉,下次关闸重新起算。
  if (state.monetaryTight) setMonetaryAnchor(state.macro?.btc?.price ?? null);
  else clearMonetaryAnchor();
  // Re-run veto with new monetary state (re-detect on existing tokens)
  if (state.tokens.length && state.macro) {
    const btcChange7d = state.macro.btc?.change7d ?? null;
    const macroCtx = {
      regime: state.macro.regime, btcChange7d,
      priceDowntrend: state.macro.priceDowntrend,
      monetaryTight: state.monetaryTight,
    };
    macroCtx.isDowntrend = macroCtx.priceDowntrend || macroCtx.monetaryTight;
    state.macro.isDowntrend = macroCtx.isDowntrend;
    state.macro.monetaryTight = state.monetaryTight;
    state.macro.monetaryStale = checkMonetaryStaleness(state.monetaryTight, state.macro.btc?.price);
    state.tokens.forEach(t => {
      t.patterns = detectPatterns(t, btcChange7d, state.tokens, macroCtx);
      t.maxScore = t.patterns.reduce((m, p) => Math.max(m, p.score), 0);
    });
  }
  render();
};
window.editChecklistItem = (gi, ii, val) => { state.checklist.groups[gi].items[ii].text = val; saveChecklist(); };
window.removeChecklistItem = (gi, ii) => {
  state.checklist.groups[gi].items.splice(ii, 1);
  saveChecklist(); render();
};
window.addChecklistItem = (gi) => {
  const id = 'c' + Date.now();
  state.checklist.groups[gi].items.push({ id, text: '新信号', hint: '', checked: false });
  saveChecklist(); render();
};
window.addChecklistGroup = () => {
  state.checklist.groups.push({ name: '🆕 新分组', items: [] });
  saveChecklist(); render();
};
window.editChecklistMeta = (key, val) => { state.checklist[key] = val; saveChecklist(); };
window.editRule = (ri, key, val) => {
  const r = state.checklist.actionRules[ri];
  r[key] = (key === 'min' || key === 'max') ? parseInt(val) || 0 : val;
  saveChecklist(); render();
};
window.editFail = (fi, val) => { state.checklist.failConditions[fi] = val; saveChecklist(); };
window.removeFail = (fi) => { state.checklist.failConditions.splice(fi, 1); saveChecklist(); render(); };
window.addFail = () => { state.checklist.failConditions.push('新失效条件'); saveChecklist(); render(); };
window.uncheckAllChecklist = () => {
  state.checklist.groups.forEach(g => g.items.forEach(it => { if (!it.auto) it.checked = false; }));
  saveChecklist(); render();
};
window.resetChecklist = () => {
  if (!confirm('恢复默认清单？你的自定义改动会丢失。')) return;
  state.checklist = JSON.parse(JSON.stringify(DEFAULT_CHECKLIST));
  syncChecklistAuto();
  saveChecklist(); render();
};

/* ============== BOOTSTRAP ============== */
if (new URLSearchParams(location.search).get('tab') === 'messages') state.tab = 'messages';
render();
cloudReady = loadCloudSnapshot();
performScan();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'open-messages') window.setTab('messages'); });
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !IS_CLOUD) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>QUANT//v6.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0a0a0a;
  --bg-panel: #141414;
  --bg-hover: #1a1a1a;
  --border: #27272a;
  --border-light: #18181b;
  --text: #f4f4f5;
  --text-dim: #a1a1aa;
  --text-mute: #71717a;
  --text-faint: #52525b;
  --emerald: #34d399;
  --emerald-bg: rgba(52, 211, 153, 0.1);
  --emerald-border: rgba(52, 211, 153, 0.3);
  --rose: #fb7185;
  --rose-bg: rgba(251, 113, 133, 0.1);
  --rose-border: rgba(251, 113, 133, 0.3);
  --amber: #fbbf24;
  --amber-bg: rgba(251, 191, 36, 0.1);
  --amber-border: rgba(251, 191, 36, 0.3);
  --cyan: #22d3ee;
  --cyan-bg: rgba(34, 211, 238, 0.1);
  --cyan-border: rgba(34, 211, 238, 0.3);
}
html, body {
  background: var(--bg); color: var(--text);
  font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 13px; line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
.tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: 'JetBrains Mono', monospace; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }

@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.spinning { animation: spin 1s linear infinite; }
.pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }

/* HEADER */
.header {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.header-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px;
}
.header-left { display: flex; align-items: center; gap: 8px; }
.brand {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.2em;
  color: var(--text-mute);
}
.brand-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-faint);
}
.brand-dot.scanning { background: var(--amber); animation: pulse-dot 1.5s ease-in-out infinite; }
.brand-dot.live { background: var(--emerald); animation: pulse-dot 1.5s ease-in-out infinite; }

.regime-badge {
  font-size: 10px; padding: 2px 8px; border-radius: 2px;
  border: 1px solid var(--text-faint); color: var(--text-dim);
}
.regime-badge.rose { color: var(--rose); border-color: var(--rose-border); background: var(--rose-bg); }
.regime-badge.emerald { color: var(--emerald); border-color: var(--emerald-border); background: var(--emerald-bg); }
.regime-badge.amber { color: var(--amber); border-color: var(--amber-border); background: var(--amber-bg); }
.regime-badge.cyan { color: var(--cyan); border-color: var(--cyan-border); background: var(--cyan-bg); }

.header-right { display: flex; gap: 6px; }
.icon-btn {
  padding: 6px; border: 1px solid var(--border); border-radius: 2px;
  color: var(--text-dim); display: inline-flex; align-items: center;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
.icon-btn.active {
  background: var(--emerald-bg); border-color: var(--emerald-border); color: var(--emerald);
}
.icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.icon-btn svg { width: 14px; height: 14px; display: block; }

/* MACRO BAR */
.macro-bar {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; padding: 6px 12px;
  border-top: 1px solid var(--border-light);
  font-size: 11px;
}
.macro-item .label {
  font-size: 9px; color: var(--text-faint);
  letter-spacing: 0.1em; text-transform: uppercase;
}
.macro-item .value {
  display: flex; align-items: baseline; gap: 6px;
}
.macro-item .primary { font-weight: 600; color: var(--text); }
.up { color: var(--emerald); }
.down { color: var(--rose); }
.flat { color: var(--text-dim); }

/* TABS */
.tabs {
  display: flex; border-top: 1px solid var(--border-light);
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 0 auto; padding: 10px 6px; font-size: 11px; letter-spacing: 0.05em;
  white-space: nowrap; flex-shrink: 0;
  color: var(--text-faint);
  border-bottom: 2px solid transparent;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.tab:hover { color: var(--text-dim); }
.tab.active {
  color: var(--emerald); border-bottom-color: var(--emerald);
  background: rgba(52, 211, 153, 0.05);
}
.tab svg { width: 11px; height: 11px; }
.tab-count {
  font-size: 9px; color: var(--text-faint);
}

/* FILTERS */
.filters {
  padding: 8px 8px; border-bottom: 1px solid var(--border-light);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.filter-row {
  display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: nowrap; width: max-content;
}
.filter-row:last-child { margin-bottom: 0; }
.chip {
  padding: 4px 10px; font-size: 10px; border-radius: 2px;
  border: 1px solid var(--border); color: var(--text-mute);
  letter-spacing: 0.03em; white-space: nowrap;
}
.chip:hover { color: var(--text-dim); }
.chip.active {
  border-color: rgba(52, 211, 153, 0.5);
  background: var(--emerald-bg); color: var(--emerald);
}
.chip-sort {
  padding: 2px 8px; font-size: 10px;
  color: var(--text-faint); border-radius: 2px;
  white-space: nowrap;
}
.chip-sort.active { background: var(--border); color: var(--text); }

/* TOKEN LIST */
.token-list { background: var(--bg); }
.token-row {
  border-bottom: 1px solid var(--border-light);
}
.token-row:hover { background: rgba(255, 255, 255, 0.02); }
.token-summary {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; width: 100%; text-align: left;
}
.token-symbol-col { width: 60px; flex-shrink: 0; }
.token-symbol {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 700; color: var(--text);
}
.token-price { font-size: 9px; color: var(--text-faint); }
.token-change-col { width: 56px; text-align: right; flex-shrink: 0; }
.token-change-24h { font-size: 11px; font-weight: 600; }
.token-change-7d { font-size: 9px; }
.token-rsi-col { width: 36px; text-align: right; flex-shrink: 0; }
.token-rsi-label { font-size: 9px; color: var(--text-faint); }
.token-rsi-value { font-size: 11px; font-weight: 600; }
.token-tags-col { flex: 1; min-width: 0; overflow: hidden; }
.token-tags { display: flex; flex-wrap: wrap; gap: 3px; }
.tag {
  display: inline-block; font-size: 8.5px;
  padding: 1.5px 5px; border-radius: 2px;
  font-weight: 600; letter-spacing: 0.04em;
  border: 1px solid;
}
.tag.emerald { color: var(--emerald); background: var(--emerald-bg); border-color: var(--emerald-border); }
.tag.rose { color: var(--rose); background: var(--rose-bg); border-color: var(--rose-border); }
.tag.amber { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-border); }
.tag.cyan { color: var(--cyan); background: var(--cyan-bg); border-color: var(--cyan-border); }
.tag-more { font-size: 8.5px; color: var(--text-faint); align-self: center; }

.chevron {
  width: 12px; height: 12px; color: var(--text-faint);
  transition: transform 0.15s; flex-shrink: 0;
}
.expanded .chevron { transform: rotate(90deg); }
.token-detail {
  background: rgba(255, 255, 255, 0.02);
  border-top: 1px solid var(--border-light);
  padding: 8px 12px 12px;
  display: none;
}
.expanded .token-detail { display: block; }
.metrics-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 8px; margin-bottom: 8px;
}
.metric .label {
  font-size: 9px; color: var(--text-faint);
  letter-spacing: 0.05em;
}
.metric .value { font-size: 11px; color: var(--text); }
.pattern-card {
  border: 1px solid; border-radius: 2px;
  padding: 6px 8px; margin-bottom: 5px;
}
.pattern-card.emerald { border-color: var(--emerended-border, var(--emerald-border)); background: var(--emerald-bg); }
.pattern-card.rose { border-color: var(--rose-border); background: var(--rose-bg); }
.pattern-card.amber { border-color: var(--amber-border); background: var(--amber-bg); }
.pattern-card.cyan { border-color: var(--cyan-border); background: var(--cyan-bg); }
.pattern-head {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 8px; margin-bottom: 2px;
}
.pattern-name { font-size: 10px; font-weight: 700; }
.pattern-name.emerald { color: var(--emerald); }
.pattern-name.rose { color: var(--rose); }
.pattern-name.amber { color: var(--amber); }
.pattern-name.cyan { color: var(--cyan); }
.pattern-score { font-size: 10px; color: var(--text-mute); }
.pattern-reason { font-size: 10px; color: var(--text-dim); line-height: 1.4; }

.action-row {
  display: flex; gap: 6px; margin-top: 8px;
  padding-top: 8px; border-top: 1px solid var(--border-light);
}
.action-btn {
  flex: 1; padding: 6px; font-size: 10px;
  border: 1px solid var(--border); border-radius: 2px;
  color: var(--text-dim); text-align: center;
  text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
}
.action-btn:hover { color: var(--text); }
.action-btn.active {
  border-color: var(--amber-border); background: var(--amber-bg); color: var(--amber);
}
.action-btn svg { width: 11px; height: 11px; }

/* REPORT */
.report-actions {
  padding: 8px 12px; border-bottom: 1px solid var(--border-light);
  display: flex; gap: 8px;
}
.action-btn-full {
  flex: 1; padding: 6px; font-size: 11px;
  border: 1px solid var(--border); border-radius: 2px;
  color: var(--text-dim);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.action-btn-full:hover { background: var(--bg-hover); color: var(--text); }
.report-body {
  padding: 12px; font-size: 10.5px; line-height: 1.6;
  color: var(--text-dim); white-space: pre-wrap; word-break: break-word;
  overflow-x: auto;
}

/* HISTORY */
.history-item {
  padding: 10px 12px; border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 12px;
}
.history-item:hover { background: var(--bg-hover); }
.history-text {
  flex: 1; font-size: 11px; color: var(--text-dim);
}
.history-key { font-size: 9px; color: var(--text-faint); margin-top: 2px; }
.del-btn { color: var(--text-faint); padding: 4px; }
.del-btn:hover { color: var(--rose); }
.del-btn svg { width: 11px; height: 11px; }

.history-back {
  padding: 8px 12px; border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 8px;
}
.history-back-btn { font-size: 11px; color: var(--text-dim); }
.history-back-btn:hover { color: var(--text); }
.history-time { font-size: 10px; color: var(--text-faint); margin-left: auto; }

/* HELP */
.help { padding: 12px; font-size: 11px; color: var(--text-dim); line-height: 1.7; }
.help-section-title {
  font-size: 10px; letter-spacing: 0.15em;
  color: var(--text-faint); margin-bottom: 6px; margin-top: 12px;
}
.help-section-title:first-child { margin-top: 0; }
.help-item {
  display: flex; gap: 8px; border-left: 2px solid;
  padding: 2px 0 2px 8px; margin-bottom: 4px;
  font-size: 11px;
}
.help-item.emerald { border-color: var(--emerald); }
.help-item.rose { border-color: var(--rose); }
.help-item.amber { border-color: var(--amber); }
.help-item.cyan { border-color: var(--cyan); }
.help-code { font-weight: 700; width: 64px; flex-shrink: 0; }
.help-desc { color: var(--text-mute); }
.help-manual { color: var(--text-mute); font-size: 11px; }
.help-manual strong { color: var(--text-dim); }
.help-footer {
  margin-top: 16px; padding-top: 12px;
  border-top: 1px solid var(--border-light);
  font-size: 10px; color: var(--text-faint); line-height: 1.6;
}

/* COMMON */
.empty {
  padding: 40px 12px; text-align: center;
  font-size: 11px; color: var(--text-faint);
}
.error-banner {
  margin: 8px; padding: 8px;
  border: 1px solid var(--rose-border); background: var(--rose-bg);
  color: var(--rose); font-size: 11px; border-radius: 2px;
  display: flex; gap: 8px; align-items: flex-start;
}
.error-banner svg { flex-shrink: 0; width: 13px; height: 13px; margin-top: 1px; }

.sec-title { padding: 14px 12px 6px; font-size: 11px; color: var(--text); letter-spacing: 0.05em; }
.sec-sub { margin-left: 8px; font-size: 9px; color: var(--text-faint); }
.qt { width: calc(100% - 24px); margin: 0 12px; border-collapse: collapse; font-size: 10px; }
.qt th { text-align: left; padding: 6px 4px; color: var(--text-faint); font-weight: 400; border-bottom: 1px solid var(--border); white-space: nowrap; }
.qt td { padding: 7px 4px; border-bottom: 1px solid var(--border-light); color: var(--text-dim); vertical-align: top; line-height: 1.5; }
.qt td b { color: var(--text); }
.qt tr.hit td { background: var(--amber-bg); }
.qt tr.thin td { opacity: 0.45; }
.qt .up { color: var(--emerald); } .qt .down { color: var(--rose); } .qt .amber { color: var(--amber); }
.qt-note { font-size: 9px; color: var(--text-faint); }
.qt-hint { padding: 10px 12px; font-size: 9px; color: var(--text-faint); line-height: 1.7; }
.badge {
  position: absolute; top: -5px; right: -5px; min-width: 15px; height: 15px; padding: 0 4px;
  background: var(--rose); color: #0a0a0a; border-radius: 8px;
  font-size: 9px; font-weight: 700; line-height: 15px; text-align: center;
}
#toast {
  position: fixed; top: 8px; left: 8px; right: 8px; z-index: 999;
  padding: 10px 12px; border-radius: 4px; cursor: pointer;
  background: #18181b; border: 1px solid var(--emerald); box-shadow: 0 6px 24px rgba(0,0,0,0.6);
  transform: translateY(-140%); transition: transform 0.25s ease; pointer-events: none;
}
#toast.show { transform: translateY(0); pointer-events: auto; }
.toast-title { font-size: 12px; color: var(--text); line-height: 1.4; }
.toast-sub { font-size: 9px; color: var(--emerald); margin-top: 3px; }
.msg-head { padding: 10px 12px 4px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.msg-notify { font-size: 10px; color: var(--text-dim); line-height: 1.6; }
.msg-note { font-size: 9px; color: var(--text-faint); line-height: 1.5; }
.msg-card { margin: 8px 12px 0; padding: 10px; border: 1px solid var(--border); border-radius: 3px; }
.msg-card.alert { border-left: 3px solid var(--amber); }
.msg-meta { display: flex; justify-content: space-between; font-size: 9px; color: var(--text-faint); margin-bottom: 5px; }
.msg-title { font-size: 12px; color: var(--text); line-height: 1.45; margin-bottom: 4px; word-break: break-word; }
.msg-line { font-size: 10px; color: var(--text-dim); line-height: 1.6; word-break: break-word; }
.auto-bar {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 12px 0; flex-wrap: wrap;
}
.auto-label { font-size: 9px; color: var(--text-faint); margin-right: 2px; }
.cloud-banner {
  margin: 8px 12px 0; padding: 8px 10px; cursor: pointer;
  border: 1px solid var(--border); border-radius: 3px;
  font-size: 10px; color: var(--text-dim); line-height: 1.5;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.cloud-link { color: var(--emerald); flex-shrink: 0; }
.footer-info {
  padding: 12px; text-align: center;
  font-size: 9px; color: var(--text-faint);
}
.star { color: var(--amber); }

/* SVG icon defaults */
.icon { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============== CONSTANTS ============== */
const CG_BASE = 'https://api.coingecko.com/api/v3';
// v5.1: 定时刷新档位(分钟)。原来固定60秒 —— 会撞CoinGecko免费限流,且不记忆;现在可选档位并持久化。
const AUTO_OPTIONS = [0, 5, 15, 30, 60];
const APP_VERSION = '6.0';
// v5.2: 1小时异动阈值(%)。只用于展示和推送,不参与任何模式判定。
const HOUR_MOVE_PCT = 3;
// 云端定时任务用无头浏览器打开本页时带 ?cloud=1:不注册Service Worker、不读云端快照、不启动定时器。
const IS_CLOUD = new URLSearchParams(location.search).has('cloud');
function loadAutoMin() {
  try { const v = JSON.parse(localStorage.getItem('qs_auto_min') ?? '0'); return AUTO_OPTIONS.includes(v) ? v : 0; }
  catch { return 0; }
}
// v5.3: 扫描池可选。50 是此前所有回测(SRR 4/4、回避信号评级)的口径;100/250 会带进大量中小市值标的。
// 扩池只改"扫多少个",不改任何判定规则 —— 但规则在小币上没有被回测过,见帮助页说明。
const POOL_OPTIONS = [50, 100, 250];
function loadPool() {
  try { const v = JSON.parse(localStorage.getItem('qs_pool') ?? '250'); return POOL_OPTIONS.includes(v) ? v : 250; }
  catch { return 250; }
}
let TOP_N = loadPool();
const HISTORY_LIMIT = 30;

const STABLECOINS = new Set([
  'usdt','usdc','dai','busd','tusd','usdp','gusd','lusd','fdusd','pyusd',
  'usde','susd','usds','usd1','rlusd','crvusd','mim','frax','sfrax','dola',
  'usdb','usdd','usdy','usd0','eurt','eurs','eurc','xaut','paxg','usn',
  'wbtc','weth','cbbtc','lbtc','tbtc','stbtc','reth','steth','wsteth',
  'wbeth','rseth','meth','ezeth','weeth','sweth','renbtc','wsol','jitosol',
  'msol','bnsol','bbtc','wbnb','wxtz','wpls'
]);

function isPeggedAsset(t) {
  if (STABLECOINS.has(t.symbol.toLowerCase())) return true;
  // Heuristic: priced near $1, ultra-low volatility across all timeframes
  if (t.price > 0.95 && t.price < 1.05 &&
      Math.abs(t.change24h) < 0.5 &&
      Math.abs(t.change7d) < 1 &&
      Math.abs(t.change30d || 0) < 2) return true;
  return false;
}

/* ============== SECTOR MAP (for SER detection) ============== */
const SECTOR_MAP = {
  ai_infra:   { name: 'AI基建',     leaders: ['render','tao','fet','akt','virtual'], members: ['render','tao','fet','akt','sahara','opg','theta','nos','asi','rndr','vvv'] },
  ai_data:    { name: 'AI数据DePIN',leaders: ['grass','theta'],                       members: ['grass','theta','masa','nmr','trac','io','iota','livepeer','lpt'] },
  perp_dex:   { name: 'Perp DEX',   leaders: ['hype','aster'],                        members: ['hype','aster','lit','dydx','gmx','jup','drift','vela'] },
  solana:     { name: 'Solana生态', leaders: ['sol'],                                 members: ['sol','jup','jto','ray','pyth','bonk','wif','popcat','grass','helium','hnt'] },
  rwa:        { name: 'RWA',        leaders: ['ondo','pendle'],                       members: ['ondo','pendle','syrup','plume','cfg','hbar','iota','xdc'] },
  defi_lend:  { name: 'DeFi借贷',   leaders: ['aave'],                                members: ['aave','comp','syrup','morpho','justlend','jst'] },
  memecoin:   { name: 'Meme',       leaders: ['doge','shib','pepe'],                  members: ['doge','shib','pepe','wif','bonk','floki','memecoin','meme','popcat'] },
  stable_yld: { name: '稳定币收益', leaders: ['ena'],                                 members: ['ena','sky','mkr','pendle','frax'] },
  political:  { name: '政治crypto', leaders: ['wlfi'],                                members: ['wlfi','trump'] },

const STALE_DAYS = 60;      // 闸关闭天数阈值
const STALE_BTC_GAIN = 15;  // 期间BTC涨幅阈值(%)

function getMonetaryAnchor() {
  try { const raw = localStorage.getItem('qs_monetary_anchor'); return raw ? JSON.parse(raw) : null; }
  catch { return null; }
}
function setMonetaryAnchor(btcPrice) {
  const anchor = { since: new Date().toISOString(), btc: btcPrice ?? null };
  try { localStorage.setItem('qs_monetary_anchor', JSON.stringify(anchor)); } catch {}
  return anchor;
}
function clearMonetaryAnchor() {
  try { localStorage.removeItem('qs_monetary_anchor'); } catch {}
}
// 返回 null = 不陈旧;否则返回 { days, btcGain, since, btcRef }
function checkMonetaryStaleness(monetaryTight, btcPrice) {
  if (!monetaryTight) return null;
  const a = getMonetaryAnchor();
  if (!a || !a.btc || !btcPrice) return null;
  const days = (Date.now() - new Date(a.since).getTime()) / 86400000;
  const btcGain = ((btcPrice - a.btc) / a.btc) * 100;
  if (days > STALE_DAYS && btcGain > STALE_BTC_GAIN) {
    return { days: Math.floor(days), btcGain, since: a.since, btcRef: a.btc };
  }
  return null;
}

/* ============== TECHNICAL INDICATORS ============== */
function calcRSI(closes, period = 14) {
  if (closes.length < period + 1) return 50;
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const d = closes[i] - closes[i - 1];
    if (d > 0) gains += d; else losses -= d;
  }
  let avgGain = gains / period, avgLoss = losses / period;
  for (let i = period + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    if (d > 0) {
      avgGain = (avgGain * (period - 1) + d) / period;
      avgLoss = (avgLoss * (period - 1)) / period;
    } else {
      avgGain = (avgGain * (period - 1)) / period;
      avgLoss = (avgLoss * (period - 1) - d) / period;
    }
  }
  if (avgLoss === 0) return 100;
  return 100 - 100 / (1 + avgGain / avgLoss);
}

function detectTripleRejection(prices) {
  // Legacy TRRP detection - kept for "short" pattern (顶部反复被拒)
  if (prices.length < 50) return false;
  const recent = prices.slice(-100);
  const maxP = Math.max(...recent);
  const minP = Math.min(...recent);
  if ((maxP - minP) / maxP < 0.03) return false;
  const topThreshold = maxP * 0.985;
  const dipThreshold = maxP * 0.96;
  let touches = 0;
  let hasDippedSinceLastTouch = true;
  for (let i = 0; i < recent.length; i++) {
    if (recent[i] < dipThreshold) {
      hasDippedSinceLastTouch = true;
    } else if (recent[i] >= topThreshold && hasDippedSinceLastTouch) {
      touches++;
      hasDippedSinceLastTouch = false;
    }
  }
  return touches >= 3;
}

// === v4.3 TBR: Triple-Bottom Reclaim ===
// 检测7d内底部反复被测试（多重底成型）
function detectTBR(prices) {
  if (!prices || prices.length < 60) return { hit: false };
  // Use last 7 days (168 hours) of sparkline
  const recent = prices.slice(-Math.min(prices.length, 168));
  const minP = Math.min(...recent);
  const maxP = Math.max(...recent);
  // Need real range - at least 5% top to bottom
  if ((maxP - minP) / maxP < 0.05) return { hit: false };
  // Touch zone: within 3% of low
  const touchZone = minP * 1.03;
  // Lift zone: must bounce at least 4% between touches
  const liftZone = minP * 1.04;
  let touches = 0;
  let hasLiftedSinceLastTouch = true;
  let firstTouch = -1;
  for (let i = 0; i < recent.length; i++) {
    if (recent[i] > liftZone) {
      hasLiftedSinceLastTouch = true;
    } else if (recent[i] <= touchZone && hasLiftedSinceLastTouch) {
      if (firstTouch < 0) firstTouch = i;
      touches++;
      hasLiftedSinceLastTouch = false;
    }
  }
  // Need at least 3 touches AND not just last-bar collapse
  const isCurrent = recent[recent.length - 1] <= touchZone;
  return {
    hit: touches >= 3 && !isCurrent, // require lift off the most recent low
    touches,
    low: minP,
    span: ((maxP - minP) / minP * 100).toFixed(0),
  };
}

// === v4.3 VEX: Volume Expansion Trigger ===
// 量爆发: 当前24h量 vs 30d均量, 配合价格上涨
function detectVEX(token) {
  // v4.4: VEX must be EARLY expansion, not a blow-off top.
  // Real VEX: high turnover (V/MC > 8%) + EARLY price move (+3% to +15%) + RSI not overbought
  const turnover = token.volMcRatio;
  if (turnover < 0.08) return { hit: false };
  // v4.4 fix: exclude over-extended moves (the chasing-the-top problem from 6/4-6/9 data)
  if (token.change24h < 3) return { hit: false };
  if (token.change24h > 15) return { hit: false, lateStage: true }; // already exploded - too late
  if (token.rsi > 72) return { hit: false }; // already too hot
  // Score: higher turnover + early price action = stronger
  let score = 6;
  if (turnover > 0.15) score++;
  if (token.change24h >= 5 && token.change24h <= 12) score++; // sweet spot
  if (token.rsi < 60) score++;
  return {
    hit: true,
    score,
    turnover: (turnover * 100).toFixed(1)
  };
}

  if (t.marketCap > 0 && t.marketCap < 50e6) {

  }
  // Post-pump reversal (7d big gain but 24h turning down = top)
  if (t.change7d > 30 && t.change24h < -3) {
    warns.push({ code: 'POST-PUMP', desc: `7d+${t.change7d.toFixed(0)}%后24h转跌，反转风险` });
  }
  // Over-extended (already pumped hard recently)
  if (t.change7d > 80) {
    warns.push({ code: 'EXTENDED', desc: `7d+${t.change7d.toFixed(0)}% 严重超买区，回撤风险高` });
  }
  return warns;
}

// === v4.3 SER: Sector Echo Rotation ===
// 板块龙头先启动 + 候选未启动 = SER机会
function detectSER(token, allTokens) {
  const sector = getTokenSector(token.symbol);
  if (!sector) return { hit: false };

  // Find sector leaders in current scan
  const leaders = allTokens.filter(t =>
    sector.leaders.includes(t.symbol.toLowerCase()) &&
    t.symbol.toLowerCase() !== token.symbol.toLowerCase()
  );
  if (leaders.length === 0) return { hit: false };

  // Average 7d performance of leaders
  const leaderAvg7d = leaders.reduce((sum, t) => sum + (t.change7d || 0), 0) / leaders.length;
  // Leader must have moved >12% in 7d
  if (leaderAvg7d < 12) return { hit: false };

  // This token must be in compression (not yet pumped)
  const thisStable = Math.abs(token.change7d || 0) < 6;
  const thisRSILow = token.rsi < 60;
  if (!thisStable || !thisRSILow) return { hit: false };

  return {
    hit: true,
    score: 7 + (leaderAvg7d > 25 ? 1 : 0),
    sectorName: sector.name,
    leaderAvg7d: leaderAvg7d.toFixed(0),
    leaderSymbols: leaders.map(l => l.symbol.toUpperCase()).join('/')
  };
}

// === v4.8 SRR: Structural Re-Rating 结构性重估判别器 ===
// LIT教训($1.35说"别追"→$3.75):HCEP是为"衰竭型pump"设计的,
// 但对有真实收入+板块轮动+催化管道的标的,高RSI是重估的起点而非终点。
// 四项打分,≥3项 → 判定为结构性重估 → HCEP降级、禁用"等回踩"逻辑。
function detectSRR(t, allTokens) {
  const checks = [];
  let score = 0;

  // 1. 真实收入/费用捕获机制
  const revenue = hasRealRevenue(t.symbol);
  if (revenue) { score++; checks.push('真实收入'); }

  // 2. 板块龙头同步走强(SER的正向应用)
  const sector = getTokenSector(t.symbol);
  let sectorStrong = false;
  if (sector && allTokens) {
    const leaders = allTokens.filter(x => sector.leaders.includes(x.symbol.toLowerCase()));
    if (leaders.length) {
      const avg30d = leaders.reduce((s, x) => s + (x.change30d || 0), 0) / leaders.length;
      if (avg30d > 20) { sectorStrong = true; score++; checks.push(`${sector.name}板块+${avg30d.toFixed(0)}%`); }
    }
  }

  // 3. 量能"持续"而非"脉冲"(换手抬升但未极端 = 资金在轮入,不是一次性引爆)
  const turnover = t.volMcRatio || 0;
  let sustainedVol = false;
  if (turnover > 0.04 && turnover < 0.30) { sustainedVol = true; score++; checks.push(`换手${(turnover*100).toFixed(0)}%持续`); }

  // 4. 多周期同向(30d和7d都在涨 = 趋势而非单日脉冲)
  let multiTF = false;
  if ((t.change30d || 0) > 15 && (t.change7d || 0) > 0) { multiTF = true; score++; checks.push('30d/7d同向'); }

  return {
    // v4.9: 阈值从 >=3 提到 =4。8/29-9/12实测依据:
    //   4/4组(SOL/HYPE/AAVE/TAO) 平均 +0.39%,跑赢BTC(-0.46%)
    //   3/4组(ENA缺换手/PUMP缺板块) 平均 -17.00%,跑输16.5pp
    // 缺任何一项都是毒药,必须四项全中。
    hit: score >= 4,
    score: Math.min(9, 5 + score),
    checks,
    revenue, sectorStrong, sustainedVol, multiTF,
    raw: score
  };
}

/* ============== PATTERN DETECTOR ============== */
function detectPatterns(t, btcChange7d, allTokens, macroCtx) {
  // Skip pegged assets entirely - stablecoins and wrapped tokens
  if (isPeggedAsset(t)) return [];

  const patterns = [];
  const pull = t.high7d > 0 ? ((t.high7d - t.price) / t.high7d) * 100 : 0;
  const isDowntrend = macroCtx?.isDowntrend || false;

  // QCI - tightened: must be in accumulation AFTER a real dip (30d<-5% or pull from 7d high >8%)
  const inAccumulation = (t.change30d != null && t.change30d < -5) || pull > 8;
  if (t.rsi >= 45 && t.rsi <= 58 && Math.abs(t.change7d) < 5 && inAccumulation) {
    patterns.push({
      code: 'QCI',
      score: 6 + (Math.abs(t.change7d) < 2 ? 1 : 0) + (t.rsi >= 48 && t.rsi <= 55 ? 1 : 0) + ((t.change30d || 0) < -15 ? 1 : 0),
      reason: `RSI ${t.rsi.toFixed(0)} 中性 | 7d ${fmtPct(t.change7d)} | 30d ${fmtPct(t.change30d || 0)}`
    });
  }

  // RPE
  if (pull >= 15 && pull < 20) patterns.push({ code: 'RPE1', score: 6, reason: `7d高点回调${pull.toFixed(1)}%` });
  else if (pull >= 20 && pull < 30) patterns.push({ code: 'RPE2', score: 7, reason: `7d高点回调${pull.toFixed(1)}%` });
  else if (pull >= 30 && t.change24h > -5) patterns.push({ code: 'RPE3', score: 8, reason: `7d深跌${pull.toFixed(1)}%企稳中` });

  // MOMENTUM
  if (t.change7d > 20 && t.rsi < 75) {
    patterns.push({ code: 'MOMENTUM', score: 7, reason: `7d ${fmtPct(t.change7d)} RSI仅${t.rsi.toFixed(0)}` });
  }

  // === TBR: Triple-Bottom Reclaim ===
  // v4.4 fix: TBR is a REVERSAL pattern. In a downtrend, "multi-bottom" = support
  // that's about to break (the SAHARA/RENDER/ICP failures of 6/4-6/9). Only valid
  // when BTC is NOT in a downtrend.
  if (t.sparkline && !isDowntrend) {
    const tbr = detectTBR(t.sparkline);
    if (tbr.hit) {
      patterns.push({
        code: 'TBR',
        score: 7 + (tbr.touches >= 4 ? 1 : 0) + (t.rsi < 50 ? 1 : 0),
        reason: `7d内${tbr.touches}次$${fmtPrice(tbr.low)}测试，区间${tbr.span}% | RSI ${t.rsi.toFixed(0)}`
      });
    }
  }

  // === VEX: Volume Expansion Trigger ===
  const vex = detectVEX(t);
  if (vex.hit) {
    patterns.push({
      code: 'VEX',
      score: vex.score,
      reason: `日换手${vex.turnover}% | 24h ${fmtPct(t.change24h)} | RSI ${t.rsi.toFixed(0)}`
    });
  }

  // === SER: Sector Echo Rotation ===
  if (allTokens && !isDowntrend) {
    const ser = detectSER(t, allTokens);
    if (ser.hit) {
      patterns.push({
        code: 'SER',
        score: ser.score,
        reason: `${ser.sectorName}龙头${ser.leaderSymbols}近7d +${ser.leaderAvg7d}% | 此标的未启动`
      });
    }
  }

  // VOL_DRY - require actual prior decline (not stablecoin flatness)
  if (t.volMcRatio > 0 && t.volMcRatio < 0.02 && Math.abs(t.change7d) < 8 &&
      (t.change30d != null && t.change30d < -10)) {
    patterns.push({ code: 'VOL_DRY', score: 6, reason: `日换手${(t.volMcRatio * 100).toFixed(1)}% 极低 | 30d ${fmtPct(t.change30d)}` });
  }

  // NEAR_ATL
  if (t.ath && t.price < t.ath * 0.1) {
    patterns.push({ code: 'NEAR_ATL', score: 5, reason: `距ATH仅${((t.price/t.ath)*100).toFixed(1)}% 历史底部区域` });
  }

  // === v4.8/v4.9 SRR: 结构性重估判别(必须在HCEP之前跑) ===
  const srrRaw = detectSRR(t, allTokens);

  // v4.9 冲突压制:相对强弱一票否决。
  // 依据:8/29的ENA同时带SRR和WEAK(7d -13.5% vs BTC -2.9%),14天后 -12.9%。
  // 一个标的不可能既"结构性重估"又"显著跑输大盘"或"顶部反复被拒"。
  const conflictWeak = btcChange7d !== null &&
                       t.change7d < btcChange7d - 10 && t.change7d < -5;
  const conflictRejected = t.sparkline && detectTripleRejection(t.sparkline);
  const srrConflict = conflictWeak || conflictRejected;

  const srr = {
    ...srrRaw,
    hit: srrRaw.hit && !srrConflict,
    suppressedBy: srrConflict ? (conflictWeak ? 'WEAK(跑输大盘)' : 'TRRP(顶部被拒)') : null
  };

  if (srr.hit) {
    patterns.push({
      code: 'SRR',
      score: srr.score,
      reason: `${srr.checks.join(' + ')} | 4/4满分·强趋势·勿预设回踩,用突破触发`
    });
  }

  // HCEP — v4.8: 结构性重估标的降级为"注意"而非"避免"
  if (t.rsi > 75) {
    if (srr.hit) {
      patterns.push({
        code: 'HCEP',
        score: Math.max(3, (t.rsi > 85 ? 9 : 7) - 4),
        srrDowngraded: true,
        reason: `RSI ${t.rsi.toFixed(0)}高位,但SRR成立(${srr.raw}/4)→ 降级为注意。回调可能不深,别等深度回踩`
      });
    } else {
      patterns.push({ code: 'HCEP', score: t.rsi > 85 ? 9 : 7, reason: `RSI ${t.rsi.toFixed(0)} 超买，等回落65` });
    }
  }

  // CRASH
  if (t.change24h < -10) {
    patterns.push({ code: 'RPE_CRASH', score: 8, reason: `24h急跌${t.change24h.toFixed(1)}% 看支撑别接刀` });
  }

  // TRRP (legacy short pattern - 顶部反复被拒)
  if (t.sparkline && detectTripleRejection(t.sparkline)) {
    patterns.push({ code: 'TRRP', score: 6, reason: `7d内顶部多次被拒` });
  }

  // WEAK
  if (btcChange7d !== null && t.change7d < btcChange7d - 10 && t.change7d < -5) {
    patterns.push({ code: 'WEAK', score: 6, reason: `7d ${fmtPct(t.change7d)} vs BTC ${fmtPct(btcChange7d)}` });
  }

  // === v4.4/v4.6/v4.8 MACRO VETO LAYER (最高优先级·双因子) ===
  // Veto longs if price downtrend OR monetary tightening. Proven necessary by:
  // 6/4-6/9 (TBR 0/8 in price downtrend) AND 6/17 (deal signed but Fed hawkish → still fell).
  // v4.8: 结构性重估标的(SRR)只降3分而非5分 —— LIT教训:有真实收入+板块轮动的标的
  // 能在弱宏观里走独立行情(LIT从$1.35→$3.75正是发生在BTC下跌趋势中)。
  if (isDowntrend) {
    const cause = (macroCtx?.priceDowntrend && macroCtx?.monetaryTight) ? '下跌趋势+货币紧缩'
                : macroCtx?.monetaryTight ? '货币紧缩(Fed鹰派)'
                : '下跌趋势';
    const srrConfirmed = patterns.some(p => p.code === 'SRR');
    const penalty = srrConfirmed ? 3 : 5;
    return patterns.map(p => {
      const ptype = PATTERNS[p.code]?.type;
      if (ptype === 'long') {
        return {
          ...p,
          score: Math.max(1, p.score - penalty),
          vetoed: true,
          srrSoftened: srrConfirmed,
          reason: srrConfirmed
            ? `⚠️${cause}·但SRR成立·仅降3分(可独立行情) | ` + p.reason
            : `⚠️${cause}·多头已否决 | ` + p.reason
        };
      }
      return p; // avoid/short signals keep full weight (they work in downtrends)
    });
  }

  return patterns;
}

/* ============== HELPERS ============== */
function fmtPct(n) { return (n >= 0 ? '+' : '') + n.toFixed(1) + '%'; }
function fmtPrice(p) {
  if (p === undefined || p === null) return '-';
  if (p >= 1000) return p.toFixed(0);
  if (p >= 1) return p.toFixed(2);
  if (p >= 0.01) return p.toFixed(4);
  return p.toFixed(6);
}
function fmtVolume(v) {
  if (v >= 1e9) return (v/1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v/1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v/1e3).toFixed(1) + 'K';
  return v.toFixed(0);
}

function generateReport(tokens, macro, time) {
  const cnTs = time.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false });
  const byCode = {};
  tokens.forEach(t => t.patterns.forEach(p => {
    if (!byCode[p.code]) byCode[p.code] = [];
    byCode[p.code].push({ ...t, _pat: p });
  }));

  const fmtList = (list) => list
    .sort((a, b) => b._pat.score - a._pat.score).slice(0, 8)
    .map(x => `- **${x.symbol.toUpperCase()}** $${fmtPrice(x.price)} | 24h${fmtPct(x.change24h)} | ⭐${x._pat.score}/10\n  ${x._pat.reason}`)
    .join('\n');

  const longCodes = ['SRR', 'TBR', 'VEX', 'SER', 'QCI', 'RPE3', 'RPE2', 'RPE1', 'MOMENTUM', 'VOL_DRY', 'NEAR_ATL'];
  const avoidCodes = ['HCEP', 'RPE_CRASH'];
  const shortCodes = ['WEAK', 'TRRP'];

  let md = `# 🟢 QUANT TERMINAL v6.0 — 扫描报告\n\n`;
  md += `**时间**: ${cnTs} (北京)  \n`;
  md += `**数据源**: CoinGecko (Top${TOP_N} by 24h volume)  \n`;
  md += `**覆盖**: ${tokens.length} 标的\n\n`;
  if (TOP_N > 50) md += `> 扫描池为 Top${TOP_N}。此前所有验证(SRR 4/4、回避信号)都基于 Top50;排名50以后的标的上的多头信号**没有回测依据**,带 NANO/MICRO 标记的尤其要当心。\n\n`;
  // === v5.0: 货币闸陈旧度提醒。只提醒,不改否决强度,不自动开闸。 ===
  if (macro.monetaryStale) {
    const st = macro.monetaryStale;
    const sinceStr = new Date(st.since).toLocaleDateString('zh-CN');
    md += `> ⚠️ **需人工复核：货币闸可能已陈旧**\n`;
    md += `> 货币闸自 ${sinceStr} 关闭至今 **${st.days} 天**,期间 BTC 从 $${fmtPrice(st.btcRef)} 涨到 $${fmtPrice(macro.btc?.price)}(**${fmtPct(st.btcGain)}**)。\n`;
    md += `> 闸关着 = 所有多头信号降5分。市场已经走高这么久,请亲自确认货币环境是否仍然紧缩 —— 如果Fed已转鸽,手动切换"货币环境"开关。\n`;
    md += `> **本工具不会自动开闸。** 10/6我提议把否决从-5放松到-2,10/15实测证明那会正好在BTC -5.1%、山寨-12%~-24%之前开闸。这个判断必须是你做的。\n\n`;
  }
  md += `---\n\n## 🌐 STEP 1｜宏观环境\n\n`;
  if (macro.btc && macro.eth) {
    md += `| 指标 | 值 |\n|---|---|\n`;
    md += `| BTC | $${fmtPrice(macro.btc.price)} (${fmtPct(macro.btc.change24h)}) |\n`;
    md += `| ETH | $${fmtPrice(macro.eth.price)} (${fmtPct(macro.eth.change24h)}) |\n`;
    md += `| BTC RSI | ${macro.btc.rsi.toFixed(0)} |\n`;
    md += `| ETH RSI | ${macro.eth.rsi.toFixed(0)} |\n`;
    md += `| ETH/BTC | ${(macro.eth.price / macro.btc.price).toFixed(5)} |\n`;
    md += `| BTC 7d | ${fmtPct(macro.btc.change7d)} |\n`;
    md += `| **市场状态** | **${macro.regime}** |\n\n`;
  }
  // v4.6: dual-factor downtrend veto banner
  if (macro.isDowntrend) {
    const cause = (macro.priceDowntrend && macro.monetaryTight) ? '价格下跌 + 货币紧缩'
                : macro.monetaryTight ? '货币紧缩(Fed鹰派)'
                : '价格下跌趋势';
    md += `> 🛑 **总闸否决已激活 (${cause})** — 多头信号(TBR/VEX/SER/QCI)降权5分。\n`;
    md += `> **v4.9例外:标注SRR(4/4满分结构性重估)的标的只降3分** —— 实测依据:8/29-9/12的4/4组跑赢BTC,3/4组跑输16.5pp,故阈值已收紧至四项全中,且跑输大盘或顶部被拒者一票否决。\n`;
    md += `> 双因子否决:价格下跌 OR 货币紧缩,任一成立即否决多头。**此环境优先看避免/做空清单,但SRR标的值得单独看。**\n\n`;
  }

  // v5.2: 1小时异动(只陈列,不参与判定)
  const movers = tokens.filter(t => t.change1h != null && Math.abs(t.change1h) >= HOUR_MOVE_PCT && !isPeggedAsset(t))
    .sort((a, b) => Math.abs(b.change1h) - Math.abs(a.change1h));
  md += `---\n\n## ⚡ 1小时异动(涨跌 ≥ ${HOUR_MOVE_PCT}%)\n\n`;
  md += movers.length
    ? movers.slice(0, 15).map(t => `- **${t.symbol.toUpperCase()}** $${fmtPrice(t.price)} | 1h${fmtPct(t.change1h)} | 24h${fmtPct(t.change24h)} | 7d${fmtPct(t.change7d)} | 市值$${fmtVolume(t.marketCap)}${(t.warnings || []).length ? ' ⚠' + t.warnings.map(w => w.code).join('/') : ''}${t.patterns.length ? ' | ' + t.patterns.map(p => PATTERNS[p.code]?.name || p.code).join(' ') : ''}`).join('\n') + (movers.length > 15 ? `\n- …另有 ${movers.length - 15} 个未列出` : '') + '\n\n'
    : `本次无。\n\n`;
  md += `> 1小时涨跌只是"正在动"的提示,不是信号。是否可做仍看下面的模式标记和总闸状态。\n\n`;
  md += boardReport() + derivsReport(tokens);
  md += `---\n\n## 🟢 STEP 2A｜多头候选\n\n`;
  let any = false;
  longCodes.forEach(c => {
    if (byCode[c]?.length) {
      any = true;
      md += `### ${PATTERNS[c].name} — ${PATTERNS[c].full} (${byCode[c].length})\n${fmtList(byCode[c])}\n\n`;
    }
  });
  if (!any) md += `*无符合条件标的*\n\n`;

  md += `---\n\n## 🔴 STEP 2B｜做空候选\n\n`;
  any = false;
  shortCodes.forEach(c => {
    if (byCode[c]?.length) {
      any = true;
      md += `### ${PATTERNS[c].name} — ${PATTERNS[c].full} (${byCode[c].length})\n${fmtList(byCode[c])}\n\n`;
    }
  });
  if (!any) md += `*无符合条件标的*\n\n`;

  md += `---\n\n## ⚠️ STEP 3｜避免触碰\n\n`;
  any = false;
  avoidCodes.forEach(c => {
    if (byCode[c]?.length) {
      any = true;
      md += `### ${PATTERNS[c].name} — ${PATTERNS[c].full} (${byCode[c].length})\n${fmtList(byCode[c])}\n\n`;
    }
  });
  if (!any) md += `*无显著高风险标的*\n\n`;

  md += `---\n\n## 📊 STEP 4｜24h涨幅Top10\n\n`;
  md += [...tokens].sort((a, b) => b.change24h - a.change24h).slice(0, 10).map(t =>
    `- **${t.symbol.toUpperCase()}** $${fmtPrice(t.price)} | ${fmtPct(t.change24h)} | RSI ${t.rsi.toFixed(0)} | ${t.patterns.map(p => PATTERNS[p.code]?.name).join(' / ') || '-'}`
  ).join('\n');

  md += `\n\n---\n\n## 📉 STEP 5｜24h跌幅Top10\n\n`;
  md += [...tokens].sort((a, b) => a.change24h - b.change24h).slice(0, 10).map(t =>
    `- **${t.symbol.toUpperCase()}** $${fmtPrice(t.price)} | ${fmtPct(t.change24h)} | RSI ${t.rsi.toFixed(0)} | ${t.patterns.map(p => PATTERNS[p.code]?.name).join(' / ') || '-'}`
  ).join('\n');

  const dp = state.poolDropped;
  if (dp && (dp.stock.length || dp.bad.length || dp.dup.length)) {
    md += `\n\n---\n\n*入池前剔除: 股票/ETF代币 ${dp.stock.length} 个${dp.stock.length ? '(' + dp.stock.slice(0, 8).join(' ') + (dp.stock.length > 8 ? ' …' : '') + ')' : ''} · 异常数据 ${dp.bad.length} 个${dp.bad.length ? '(' + dp.bad.join(' ') + ')' : ''} · 同名重复 ${dp.dup.length} 个${dp.dup.length ? '(' + dp.dup.join(' ') + ')' : ''}*`;
  }
  md += `\n\n---\n\n*数据源: CoinGecko公共API（含资金费/OI的部分模式需手动复核新闻+链上）*`;
  return md;
}

}
function saveChecklist() {
  try { localStorage.setItem('qs_checklist', JSON.stringify(state.checklist)); } catch {}
}
function syncChecklistAuto() {
  // Fusion: scanner regime auto-fills the regime gate items
  if (!state.checklist || !state.macro) return;
  const m = state.macro;
  // r1/r2 reflect PRICE regime (not the combined gate, so price recovery shows even if monetary still tight)
  const priceOk = !m.priceDowntrend;
  const btc7dOk = m.btc && (m.btc.change7d ?? -99) > -5;
  state.checklist.groups.forEach(g => g.items.forEach(it => {
    if (!it.auto) return;
    if (it.id === 'r1') it.checked = priceOk;
    else if (it.id === 'r2') it.checked = priceOk;
    else if (it.id === 'r3') it.checked = btc7dOk;
  }));
  saveChecklist();
}

function computeChecklistScore() {
  let checked = 0, total = 0, gatePassed = true;
  (state.checklist?.groups || []).forEach(g => g.items.forEach(it => {
    if (it.noScore) return; // token-catalyst items don't count toward macro risk-on score
    total++;
    if (it.checked) checked++;
    if (it.gate && !it.checked) gatePassed = false;
  }));
  // Find matching action rule
  let rule = null;
  (state.checklist?.actionRules || []).forEach(r => {
    if (checked >= r.min && checked <= r.max) rule = r;
  });
  return { checked, total, gatePassed, rule };
}

/* ============== SCAN ============== */
async function performScan() {
  if (state.loading) return;
  state.loading = true; state.error = null; render();
  try {
    const url = `${CG_BASE}/coins/markets?vs_currency=usd&order=volume_desc&per_page=${TOP_N}&page=1&sparkline=true&price_change_percentage=1h,24h,7d,30d`;
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) {
      if (res.status === 429) throw new Error('CoinGecko限流：等60秒重试（免费API限制10-30次/分钟）');
      throw new Error(`CoinGecko API错误 ${res.status}`);
    }
    const raw = await res.json();
    if (!Array.isArray(raw)) throw new Error('数据格式错误');

    const { kept, dropped } = cleanPool(raw);   // v5.5
    state.poolDropped = dropped;
    const tokens = kept.map(c => {
      const spark = c.sparkline_in_7d?.price || [];
      const rsi = spark.length >= 15 ? calcRSI(spark.slice(-30)) : 50;
      const high7d = spark.length ? Math.max(...spark) : c.high_24h || 0;
      const low7d = spark.length ? Math.min(...spark) : c.low_24h || 0;
      const change24h = c.price_change_percentage_24h || 0;
      const change1h = c.price_change_percentage_1h_in_currency ?? null;   // v5.2: 可能为null(CoinGecko偶尔不给)
      const change7d = c.price_change_percentage_7d_in_currency || 0;
      const change30d = c.price_change_percentage_30d_in_currency || 0;
      const volMcRatio = c.market_cap > 0 ? (c.total_volume / c.market_cap) : 0;
      return {
        id: c.id,
        symbol: c.symbol,
        name: c.name,
        price: c.current_price,
        marketCap: c.market_cap,
        volume24h: c.total_volume,
        volMcRatio,
        change1h, change24h, change7d, change30d,
        high7d, low7d,
        ath: c.ath, atl: c.atl,
        athChange: c.ath_change_percentage,
        rsi,
        sparkline: spark,
        patterns: [],
      };
    });

    const btc = tokens.find(t => t.symbol === 'btc');
    const eth = tokens.find(t => t.symbol === 'eth');
    const btcChange7d = btc?.change7d ?? null;

    // === v4.4: Compute regime FIRST (so veto can use it) ===
    let regime = '震荡', regimeColor = 'zinc';
    if (btc && eth) {
      if (btc.change24h < -3 && eth.change24h < -3) { regime = 'Risk-Off'; regimeColor = 'rose'; }
      else if (btc.change24h > 3 && eth.change24h > 3) { regime = 'Risk-On'; regimeColor = 'emerald'; }
      else if (btc.change24h < -1 && eth.change24h < -1) { regime = '弱势震荡'; regimeColor = 'amber'; }
      else if (btc.change24h > 1 && eth.change24h > 1) { regime = '条件性Risk-On'; regimeColor = 'cyan'; }
      else regime = '震荡';
    }

    // === v4.4: Macro context passed to detector for veto ===
    const macroCtx = {
      regime,
      btcChange7d,
      btcChange24h: btc?.change24h ?? 0,
      btcRSI: btc?.rsi ?? 50,
      // v4.6 DUAL-FACTOR gate: price downtrend OR monetary tightening → veto longs.
      // This fixes the 6/17 mistake (deal signed but Fed hawkish → still should NOT buy).
      priceDowntrend: (btcChange7d != null && btcChange7d < -8) || ['Risk-Off', '弱势震荡'].includes(regime),
      monetaryTight: state.monetaryTight,
    };
    macroCtx.isDowntrend = macroCtx.priceDowntrend || macroCtx.monetaryTight;

    // === v5.0: 货币闸起算点。闸处于关闭且还没有起算点时,以本次扫描为起算(无法追溯历史关闸日)。 ===
    if (state.monetaryTight && !getMonetaryAnchor() && btc?.price) setMonetaryAnchor(btc.price);
    const monetaryStale = checkMonetaryStaleness(state.monetaryTight, btc?.price);

    tokens.forEach(t => {
      t.patterns = detectPatterns(t, btcChange7d, tokens, macroCtx);
      t.maxScore = t.patterns.reduce((m, p) => Math.max(m, p.score), 0);
      t.warnings = computeWarnings(t);
      // v5.5: 市值为0 = CoinGecko没有流通量数据。原来这类标的反而没有任何小盘警告。
      if (!t.marketCap && !isPeggedAsset(t)) t.warnings.push({ code: 'NO-MCAP', desc: '市值未知(无流通量数据)，按纳米盘对待' });
    });

    state.tokens = tokens;
    state.macro = { btc, eth, regime, regimeColor, isDowntrend: macroCtx.isDowntrend, priceDowntrend: macroCtx.priceDowntrend, monetaryTight: macroCtx.monetaryTight, monetaryStale };
    syncChecklistAuto();
    state.lastScan = new Date();
    state.report = generateReport(tokens, state.macro, state.lastScan);

    saveScan(state.lastScan.toISOString(), {
      timestamp: state.lastScan.toISOString(),
      regime, btc_close: btc?.price, eth_close: eth?.price,
      report: state.report,
      summary: tokens.filter(t => t.patterns.length > 0).slice(0, 30).map(t => ({
        s: t.symbol, p: t.price, c24: t.change24h, c7: t.change7d, r: t.rsi,
        pat: t.patterns.map(x => ({ c: x.code, s: x.score, r: x.reason }))
      }))
    });
    // v5.4: 本机提醒 → 消息列表。出错不能影响扫描本身。
    if (!IS_CLOUD) {
      // 先等云端消息到(最多3秒),这样云端已报过的同一条不会在本机再报一遍
      await Promise.race([cloudReady, new Promise(r => setTimeout(r, 3000))]);
      try { processLocalAlerts(); } catch (e) { console.warn('alerts fail', e); }
    }
  } catch (e) {
    state.error = e.message || '扫描失败';
  } finally {
    state.loading = false;
    scheduleNext();   // v5.1: 每次扫描(手动或自动)结束后重新计时
    render();
  }
}

/* ============== v5.5: 入池前清洗 ============== */
// 只决定"扫谁",不改任何判定规则。三类东西不该进一个加密币扫描器:
//   股票/ETF代币 —— 跟着美股走,RSI超买、回调分级这些模式对它们没有意义(11/16实测:SPY、QQQB、TTWO 占了"避免"榜前列)
//   脏数据       —— 价格或涨跌幅明显不可能(POLYGOLD 报价 4.7e17、24h +7e20%)
//   同名重复     —— 同一symbol的多个条目,按成交量排序只留第一个
const TOKENIZED_STOCK_RE = /tokenized|bstocks?\b|xstocks?\b|backpack[- ]securities/i;
function cleanPool(raw) {
  const dropped = { stock: [], bad: [], dup: [] }, seen = new Set(), kept = [];
  for (const c of raw) {
    const sym = String(c.symbol || '').toUpperCase();
    const p = c.current_price, c24 = c.price_change_percentage_24h;
    if (!Number.isFinite(p) || p <= 0 || p > 1e7 || (Number.isFinite(c24) && Math.abs(c24) > 10000)) { dropped.bad.push(sym); continue; }
    if (TOKENIZED_STOCK_RE.test(`${c.id} ${c.name}`)) { dropped.stock.push(sym); continue; }
    if (seen.has(sym)) { dropped.dup.push(sym); continue; }
    seen.add(sym); kept.push(c);
  }
  return { kept, dropped };
}

/* ============== v6.0: 盯盘(价位/持仓) 与 衍生品 —— 报告、盯盘页、邮件共用 ============== */
const DEFAULT_MAJORS = ['btc', 'eth', 'sol', 'bnb', 'xrp'];
const fmtFr = (fr) => (fr == null ? '—' : `${fr >= 0 ? '+' : ''}${(fr * 100).toFixed(4)}%`);
const fmtFrAnn = (fr) => (fr == null ? '—' : `${fr >= 0 ? '+' : ''}${(fr * 3 * 365 * 100).toFixed(0)}%`);
// 衍生品数据超过3小时就不用了:过期的资金费率比没有更误导
function derivsFresh() {
  const d = state.derivs;
  return d && d.coins && Date.now() - new Date(d.time).getTime() < 3 * 3600e3 ? d : null;
}
// 按symbol对上之后再核一次价格:小币重名很多,价格差超过15%就当作不是同一个币
function derivOf(t) {
  const d = derivsFresh()?.coins?.[t.symbol.toUpperCase()];
  if (!d) return null;
  if (d.px > 0 && t.price > 0 && Math.abs(d.px / t.price - 1) > 0.15) return null;
  return d;
}
// 把配置里的价位和持仓对上当前价格,算出距离和盈亏
function buildBoard(cfg) {
  const c = cfg || state.cloudCfg || {};
  const bySym = {};
  state.tokens.forEach(t => { const s = t.symbol.toUpperCase(); if (!bySym[s]) bySym[s] = t; });
  const levels = (c.levels || []).map(L => {
    const t = bySym[String(L.s).toUpperCase()];
    if (!t || !(L.price > 0)) return null;
    const below = L.dir === 'below';
    return { s: String(L.s).toUpperCase(), dir: below ? 'below' : 'above', price: L.price, note: L.note || '', p: t.price,
      dist: (L.price / t.price - 1) * 100, hit: below ? t.price <= L.price : t.price >= L.price };
  }).filter(Boolean);
  const positions = (c.positions || []).map(P => {
    const t = bySym[String(P.s).toUpperCase()];
    if (!t || !(P.entry > 0)) return null;
    const long = P.side !== 'short', lev = P.lev > 0 ? P.lev : 1;
    return { s: String(P.s).toUpperCase(), side: long ? 'long' : 'short', entry: P.entry, stop: P.stop || null, target: P.target || null, lev, note: P.note || '',
      p: t.price, pnl: (t.price / P.entry - 1) * 100 * (long ? 1 : -1) * lev,
      tags: t.patterns.map(p => PATTERNS[p.code]?.name || p.code) };
  }).filter(Boolean);
  const majors = (c.majors || DEFAULT_MAJORS).map(m => {
    const t = bySym[String(m).toUpperCase()]; if (!t) return null;
    const d = derivOf(t);
    return { s: t.symbol.toUpperCase(), p: t.price, c24: t.change24h, c7: t.change7d, h7: t.high7d, l7: t.low7d,
      fr: d?.fr ?? null, oi: d?.oi ?? null, dOi24: d?.dOi24 ?? null, ls: d?.ls ?? null };
  }).filter(Boolean);
  return { levels, positions, majors };
}

// v6.0: 报告里的"盯盘"段
function boardReport() {
  const b = buildBoard();
  if (!b.levels.length && !b.positions.length) return '';
  let md = `---\n\n## 🎯 盯盘\n\n`;
  if (b.levels.length) {
    md += `| 标的 | 现价 | 条件 | 距离 | 备注 |\n|---|---|---|---|---|\n`;
    b.levels.forEach(L => { md += `| ${L.s} | $${fmtPrice(L.p)} | ${L.dir === 'below' ? '跌破' : '站上'} $${fmtPrice(L.price)} | ${L.hit ? '**已触发**' : fmtPct(L.dist)} | ${L.note} |\n`; });
    md += `\n`;
  }
  if (b.positions.length) {
    md += `| 持仓 | 方向 | 入场 | 现价 | 盈亏 | 止损 | 目标 | 标记 |\n|---|---|---|---|---|---|---|---|\n`;
    b.positions.forEach(P => { md += `| ${P.s} | ${P.side === 'long' ? '多' : '空'}${P.lev > 1 ? ' ' + P.lev + 'x' : ''} | $${fmtPrice(P.entry)} | $${fmtPrice(P.p)} | ${fmtPct(P.pnl)} | ${P.stop ? '$' + fmtPrice(P.stop) : '—'} | ${P.target ? '$' + fmtPrice(P.target) : '—'} | ${P.tags.join(' ') || '—'} |\n`; });
    md += `\n`;
  }
  return md;
}
// v6.0: 报告里的"衍生品"段。只陈列,不参与任何模式判定。
function derivsReport(tokens) {
  const d = derivsFresh();
  if (!d) return '';
  const b = buildBoard();
  const names = { hl: 'Hyperliquid', okx: 'OKX', bybit: 'Bybit', binance: 'Binance' };
  const src = Object.entries(d.sources || {}).filter(([k, v]) => v.ok && !k.startsWith('ls_')).map(([k]) => names[k] || k);
  let md = `---\n\n## 🧮 衍生品(资金费率 / 持仓量 / 多空比)\n\n`;
  md += `**数据**: ${src.join(' + ') || '—'} · ${new Date(d.time).toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Shanghai' })}\n\n`;
  md += `| 标的 | 资金费率/8h | 年化 | 持仓量 | 24h变化 | 多空比 |\n|---|---|---|---|---|---|\n`;
  b.majors.forEach(m => { md += `| ${m.s} | ${fmtFr(m.fr)} | ${fmtFrAnn(m.fr)} | ${m.oi ? '$' + fmtVolume(m.oi) : '—'} | ${m.dOi24 == null ? '—' : fmtPct(m.dOi24)} | ${m.ls == null ? '—' : m.ls.toFixed(2)} |\n`; });
  // 极值榜只看持仓量500万美元以上的,太小的合约费率没有参考价值
  const rows = tokens.filter(t => !isPeggedAsset(t)).map(t => ({ t, d: derivOf(t) })).filter(x => x.d && x.d.fr != null && x.d.oi >= 5e6);
  const line = (x) => `${x.t.symbol.toUpperCase()} ${fmtFr(x.d.fr)}`;
  if (rows.length >= 6) {
    const byFr = rows.slice().sort((x, y) => y.d.fr - x.d.fr);
    md += `\n**资金费率最高**(多头付费最多): ${byFr.slice(0, 5).map(line).join(' · ')}\n`;
    md += `**资金费率最低**(空头付费最多): ${byFr.slice(-5).reverse().map(line).join(' · ')}\n`;
    const byOi = rows.filter(x => x.d.dOi24 != null).sort((x, y) => y.d.dOi24 - x.d.dOi24).slice(0, 5);
    if (byOi.length) md += `**持仓量24h增幅最大**: ${byOi.map(x => `${x.t.symbol.toUpperCase()} ${fmtPct(x.d.dOi24)}(价格24h ${fmtPct(x.t.change24h)})`).join(' · ')}\n`;
  }
  md += `\n> 读法:费率为正=多头付钱给空头,越高说明多头越拥挤;为负则相反。持仓量增加而价格下跌,通常是新开空单或多头被套加仓;持仓量和价格一起跌,是多头在平仓离场。这一段只陈列,不参与模式判定。\n\n`;
  return md;
}

/* ============== v5.4: 提醒规则(App与云端共用这一份) ============== */
// 返回当前"处于触发状态"的提醒。是否算"新消息"由调用方做边沿检测:key上一次不在、这一次在,才报。
const DEFAULT_ALERTS = { regimeChange: true, gateFlip: true, gateStale: true, newSRR: true, btcMove24hPct: 5, watchMove24hPct: 10, hourlyMovePct: 3, hourlyMinMcapUsd: 50e6, autoLevels: true, fundingExtreme8hPct: 0.05 };
function computeAlerts(snap, prev, cfg) {
  const a = { ...DEFAULT_ALERTS, ...(cfg || {}) };
  const out = [];
  // v5.6: 只在进入/离开 Risk-Off 时提醒。市场状态只看24小时涨跌,在震荡/弱势震荡/Risk-On之间来回切换是常态,不值得每次都推。
  if (a.regimeChange && prev && prev.regime && (prev.regime === 'Risk-Off') !== (snap.regime === 'Risk-Off'))
    out.push({ key: `regime:${snap.regime}`, text: snap.regime === 'Risk-Off' ? `进入 Risk-Off(此前:${prev.regime})` : `离开 Risk-Off → ${snap.regime}` });
  if (a.gateFlip && prev && prev.gate && !!prev.gate.closed !== !!snap.gate.closed)
    out.push({ key: `gate:${snap.gate.closed}`, text: `总闸${snap.gate.closed ? '关闭(多头信号被否决)' : '打开(多头信号放行)'} —— 价格因子:${snap.gate.priceDowntrend ? '下跌' : '正常'},货币因子:${snap.gate.monetaryTight ? '紧缩' : '中性/宽松'}` });
  if (a.gateStale && snap.gate.stale)
    out.push({ key: 'stale', text: `货币闸需人工复核:已关闭${snap.gate.stale.days}天,期间BTC ${fmtPct(snap.gate.stale.btcGain)}。请确认货币环境是否仍然紧缩(工具不会自动开闸)` });
  if (a.newSRR)
    snap.srr.forEach(x => out.push({ key: `srr:${x.s}`, text: `SRR 4/4:${x.s} $${fmtPrice(x.p)} —— ${x.reason}` }));
  if (a.btcMove24hPct && snap.btc && Math.abs(snap.btc.c24) >= a.btcMove24hPct)
    out.push({ key: `btc24:${snap.btc.c24 > 0 ? 'up' : 'down'}`, text: `BTC 24h ${fmtPct(snap.btc.c24)},现价 $${fmtPrice(snap.btc.p)}` });
  if (a.watchMove24hPct)
    (snap.watch || []).filter(w => Math.abs(w.c24) >= a.watchMove24hPct).forEach(w =>
      out.push({ key: `watch:${w.s}:${w.c24 > 0 ? 'up' : 'down'}`, text: `自选 ${w.s} 24h ${fmtPct(w.c24)},现价 $${fmtPrice(w.p)}` }));
  // ---- v6.0: 价位 / 7日新高新低 / 持仓 / 资金费率极端 ----
  const bySym = {};
  (snap.all || []).forEach(t => { if (!bySym[t.s]) bySym[t.s] = t; });
  const day = snap.time.slice(0, 10);
  (a.levels || []).forEach(L => {
    const t = bySym[String(L.s).toUpperCase()];
    if (!t || !(L.price > 0)) return;
    const below = L.dir === 'below';
    // 条件成立期间key一直在,所以只在"刚穿过"时报一次;价格回去再穿,会再报
    if (below ? t.p <= L.price : t.p >= L.price)
      out.push({ key: `lvl:${t.s}:${below ? 'below' : 'above'}:${L.price}`, text: `${t.s} ${below ? '跌破' : '站上'} $${fmtPrice(L.price)}(现价 $${fmtPrice(t.p)})${L.note ? ' —— ' + L.note : ''}` });
  });
  const focus = new Set([...(a.majors || DEFAULT_MAJORS), ...(a.levels || []).map(l => l.s), ...(a.positions || []).map(p => p.s), ...(snap.watch || []).map(w => w.s)].map(x => String(x).toUpperCase()));
  if (a.autoLevels) focus.forEach(sym => {
    const t = bySym[sym]; if (!t) return;
    if (t.l7 > 0 && t.p <= t.l7) out.push({ key: `lo7:${sym}:${day}`, text: `${sym} 创7日新低 $${fmtPrice(t.p)}` });
    if (t.h7 > 0 && t.p >= t.h7) out.push({ key: `hi7:${sym}:${day}`, text: `${sym} 创7日新高 $${fmtPrice(t.p)}` });
  });
  (a.positions || []).forEach(P => {
    const sym = String(P.s).toUpperCase(), t = bySym[sym];
    if (!t || !(P.entry > 0)) return;
    const long = P.side !== 'short', lev = P.lev > 0 ? P.lev : 1;
    const pnl = (t.p / P.entry - 1) * 100 * (long ? 1 : -1) * lev;
    const tag = `持仓 ${sym} ${long ? '多' : '空'}(入场 $${fmtPrice(P.entry)},现价 $${fmtPrice(t.p)},${fmtPct(pnl)}${lev > 1 ? ' @' + lev + 'x' : ''})`;
    if (P.stop > 0 && (long ? t.p <= P.stop : t.p >= P.stop)) out.push({ key: `pos:${sym}:stop:${P.stop}`, text: `${tag} 触及止损 $${fmtPrice(P.stop)}` });
    if (P.target > 0 && (long ? t.p >= P.target : t.p <= P.target)) out.push({ key: `pos:${sym}:target:${P.target}`, text: `${tag} 到达目标 $${fmtPrice(P.target)}` });
    const adverse = long ? ['RPE_CRASH', 'WEAK', 'TRRP'] : ['SRR', 'MOMENTUM', 'TBR'];
    (t.pats || []).filter(x => adverse.includes(x.c)).forEach(x =>
      out.push({ key: `pos:${sym}:${x.c}`, text: `${tag} 出现不利标记 ${snap.patTypes?.[x.c]?.name || x.c}` }));
  });
  if (a.fundingExtreme8hPct && snap.dv) focus.forEach(sym => {
    const d = snap.dv[sym];
    if (d && d.fr != null && Math.abs(d.fr * 100) >= a.fundingExtreme8hPct)
      out.push({ key: `fr:${sym}:${d.fr > 0 ? 'pos' : 'neg'}:${day}`, text: `${sym} 资金费率极端 ${fmtFr(d.fr)}/8h(年化 ${fmtFrAnn(d.fr)}),${d.fr > 0 ? '多头拥挤' : '空头拥挤'}` });
  });
  // 1小时异动:key里带"小时",同一小时内不重复;下一小时仍超阈值会再报(那是新的一小时)
  if (a.hourlyMovePct) {
    const hourKey = snap.time.slice(0, 13);
    (snap.all || []).filter(t => t.c1h != null && Math.abs(t.c1h) >= a.hourlyMovePct && (t.mc || 0) >= (a.hourlyMinMcapUsd || 0))
      .sort((x, y) => Math.abs(y.c1h) - Math.abs(x.c1h))
      .forEach(t => out.push({ key: `h1:${t.s}:${hourKey}`, text: `${t.s} 1小时 ${fmtPct(t.c1h)},现价 $${fmtPrice(t.p)}`, mover: t }));
  }
  return out;
}
// 把一批新触发的提醒(或一次定时简报)整理成一条消息。App消息列表和云端 data/messages.json 用同一个格式。
function buildMessage(snap, fresh, isDigest, src) {
  const movers = fresh.filter(a => a.mover).map(a => a.mover);
  const others = fresh.filter(a => !a.mover);
  const lines = [];
  if (isDigest) lines.push(`${snap.regime} · BTC $${fmtPrice(snap.btc?.p)} (24h ${fmtPct(snap.btc?.c24 || 0)}) · 总闸${snap.gate.closed ? '关' : '开'} · SRR ${snap.srr.length} · 多头${snap.longs.length} · 回避/偏空${snap.avoid.length + snap.shorts.length}`);
  others.forEach(a => lines.push(a.text));
  movers.slice(0, 10).forEach(m => lines.push(`${m.s} 1h ${fmtPct(m.c1h)} · $${fmtPrice(m.p)} · 24h ${fmtPct(m.c24)}${(m.warn || []).length ? ' ⚠' + m.warn.join('/') : ''}${(m.tags || []).length ? ' · ' + m.tags.join(' ') : ''}`));
  if (movers.length > 10) lines.push(`…另有 ${movers.length - 10} 个1小时异动未列出`);
  let title;
  if (others.length) title = others[0].text.split(' —— ')[0] + (fresh.length > 1 ? ` 等${fresh.length}条` : '');
  else if (movers.length) title = `1小时异动 ${movers.length} 个:${movers.slice(0, 3).map(m => `${m.s} ${fmtPct(m.c1h)}`).join(' ')}${movers.length > 3 ? ' 等' : ''}`;
  else title = `定时简报:${snap.regime} · BTC $${fmtPrice(snap.btc?.p)} (24h ${fmtPct(snap.btc?.c24 || 0)})`;
  if (isDigest && fresh.length) title = '简报｜' + title;
  return { id: `${src}:${snap.time}`, time: snap.time, src, kind: fresh.length ? 'alert' : 'digest', title, lines, keys: fresh.map(a => a.key) };
}

/* ============== v5.4: 消息列表 / 弹窗 / 系统通知 ============== */
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const MSG_LIMIT = 100;
let cloudReady = Promise.resolve();
function allMessages() {
  return [...state.cloudMsgs, ...state.localMsgs].sort((a, b) => (a.time < b.time ? 1 : -1));
}
function unreadCount() {
  return allMessages().filter(m => new Date(m.time).getTime() > state.msgReadAt).length;
}
function markMessagesRead() {
  // 取"现在"和最新消息时间的较大者:手机时钟比云端慢一点时,也不会留下读不掉的未读
  state.msgReadAt = allMessages().reduce((m, x) => Math.max(m, new Date(x.time).getTime()), Date.now());
  lsSet('qs_msg_read_at', state.msgReadAt);
}
let toastTimer = null;
function showToast(msg, extra) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.innerHTML = `<div class="toast-title">${escapeHtml(msg.title)}</div><div class="toast-sub">${escapeHtml(extra || (msg.src === 'cloud' ? '云端扫描' : '本机扫描'))} · 点击查看</div>`;
  el.onclick = () => { el.classList.remove('show'); window.setTab('messages'); };
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 7000);
}
function notifyState() {
  if (!('Notification' in window)) return 'unsupported';
  return Notification.permission;   // default | granted | denied
}
async function systemNotify(msg) {
  try {
    if (notifyState() !== 'granted') return;
    const opts = { body: (msg.lines || []).slice(0, 4).join('\n'), icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'qs-' + (msg.kind || 'alert'), renotify: true };
    const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if (reg) await reg.showNotification(msg.title, opts);

}
function announce(msg, extra) {
  if (state.tab === 'messages' && document.visibilityState === 'visible') { markMessagesRead(); }
  else showToast(msg, extra);
  systemNotify(msg);
}
// 本机每次实时扫描后调用:用同一套规则算提醒,新触发的记成一条消息
function processLocalAlerts() {
  const snap = buildSnapshot();
  if (!snap) return;
  let prev = lsGet('qs_last_lite');
  let prevKeys = new Set(lsGet('qs_alert_keys') || []);
  // 上次扫描是6小时以前的:不拿它比"状态变化",当作重新开始
  if (prev && Date.now() - new Date(prev.time).getTime() > 6 * 3600e3) { prev = null; prevKeys = new Set(); }
  // v6.0: 能读到云端配置时,本机也按同一份价位/持仓/阈值算提醒
  const cc = state.cloudCfg;
  const active = computeAlerts(snap, prev, cc ? { ...(cc.alerts || {}), levels: cc.levels, positions: cc.positions, majors: cc.majors } : null);
  // 云端3小时内已经报过的同一条,本机不再重复
  const cloudKeys = new Set();
  state.cloudMsgs.filter(m => Date.now() - new Date(m.time).getTime() < 3 * 3600e3).forEach(m => (m.keys || []).forEach(k => cloudKeys.add(k)));
  const fresh = active.filter(x => !prevKeys.has(x.key) && !cloudKeys.has(x.key));
  lsSet('qs_alert_keys', active.map(x => x.key));
  lsSet('qs_last_lite', { regime: snap.regime, gate: { closed: snap.gate.closed }, time: snap.time });
  if (!fresh.length) return;
  const msg = buildMessage(snap, fresh, false, 'local');
  state.localMsgs = [msg, ...state.localMsgs].slice(0, MSG_LIMIT);
  lsSet('qs_messages', state.localMsgs);
  announce(msg);
}
async function loadCloudMessages() {
  if (IS_CLOUD || !location.protocol.startsWith('http')) return;
  try {
    const res = await fetch('data/messages.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const list = await res.json();
    if (!Array.isArray(list)) return;
    state.cloudMsgs = list;
    const seen = lsGet('qs_cloud_seen');
    const newest = list.reduce((m, x) => (x.time > m ? x.time : m), '');
    if (newest) lsSet('qs_cloud_seen', newest);
    // 第一次打开只建立基线,不把历史消息当新消息弹出来
    const fresh = seen ? list.filter(x => x.time > seen) : [];
    if (fresh.length) announce(fresh[0], fresh.length > 1 ? `云端扫描 · 共${fresh.length}条新消息` : null);
    render();
  } catch {}
}

/* ============== v5.1: 定时刷新 ============== */
// 用 setTimeout 链而不是 setInterval:手动扫描会重置倒计时,不会出现"刚手动扫完又自动扫一次"。
// 手机浏览器在后台会冻结定时器,所以另有 visibilitychange 兜底:切回前台时若已过点,立即补扫。
function scheduleNext() {
  if (state.intervalId) { clearTimeout(state.intervalId); state.intervalId = null; }
  state.nextScanAt = null;
  if (!state.autoMin || IS_CLOUD) return;
  const ms = state.autoMin * 60000;
  state.nextScanAt = Date.now() + ms;
  state.intervalId = setTimeout(() => performScan(), ms);
}
function setAutoMin(min) {
  state.autoMin = AUTO_OPTIONS.includes(min) ? min : 0;
  try {
    localStorage.setItem('qs_auto_min', JSON.stringify(state.autoMin));
    if (state.autoMin) localStorage.setItem('qs_auto_last', JSON.stringify(state.autoMin));
  } catch {}
  scheduleNext();
  render();
}
// v5.3: 切换扫描池并立即重扫
function setPool(n) {
  if (!POOL_OPTIONS.includes(n) || n === TOP_N) return;
  TOP_N = n;
  try { localStorage.setItem('qs_pool', JSON.stringify(n)); } catch {}
  performScan();
}
// 顶栏 ▶/⏸ 按钮:开 = 恢复上次用的档位(默认15分钟),关 = 0
function setAutoRefresh(on) {
  let last = 15;
  try { const v = JSON.parse(localStorage.getItem('qs_auto_last') ?? '15'); if (AUTO_OPTIONS.includes(v) && v) last = v; } catch {}
  setAutoMin(on ? last : 0);
}
document.addEventListener('visibilitychange', () => {

/* ============== v5.1: 云端快照 ============== */
// 云端定时任务(GitHub Actions)每次扫描后把结果写进 data/latest.json。App 打开时读它:
// 实时扫描还没回来、或被CoinGecko限流时,至少能看到最近一次定时扫描的结论。
async function loadCloudSnapshot() {
  if (IS_CLOUD || !location.protocol.startsWith('http')) return;
  try {
    const res = await fetch('data/latest.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const d = await res.json();
    if (d && d.time && d.report) { state.cloud = d; render(); }
  } catch {}
  await loadCloudMessages();
  // v6.0: 衍生品、云端配置(价位/持仓)、账本汇总
  const get = async (path) => { try { const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch { return null; } };
  const [dv, cfg, led] = await Promise.all([get('data/derivs.json'), get('cloud/config.json'), get('data/ledger/summary.json')]);
  if (dv && dv.coins) state.derivs = dv;
  if (cfg) state.cloudCfg = cfg;
  if (led) state.ledger = led;
  state.cloudTried = true;
  render();
}

// 邮件里的数字全部取自这里 —— 和App里看到的是同一次计算,不存在第二套判定逻辑。
function buildSnapshot() {
  if (!state.lastScan || !state.macro) return null;
  const m = state.macro;
  const slim = t => ({ s: t.symbol.toUpperCase(), id: t.id, p: t.price, mc: t.marketCap, warn: (t.warnings || []).map(w => w.code), c1h: t.change1h, c24: t.change24h, c7: t.change7d, c30: t.change30d, rsi: Math.round(t.rsi) });
  const withPat = (t, p) => ({ ...slim(t), code: p.code, tag: PATTERNS[p.code]?.name || p.code, score: p.score, reason: p.reason, vetoed: !!p.vetoed, softened: !!p.srrSoftened });
  const byType = (type) => {
    const out = [];
    state.tokens.forEach(t => {
      const ps = t.patterns.filter(p => PATTERNS[p.code]?.type === type);
      if (ps.length) out.push(withPat(t, ps.reduce((a, b) => (b.score > a.score ? b : a))));
    });
    return out.sort((a, b) => b.score - a.score);
  };
  const srr = [];
  state.tokens.forEach(t => { const p = t.patterns.find(x => x.code === 'SRR'); if (p) srr.push(withPat(t, p)); });
  const watch = state.tokens.filter(t => state.watchlist.includes(t.symbol)).map(t => ({
    ...slim(t), tags: t.patterns.map(p => PATTERNS[p.code]?.name || p.code),
  }));
  return {
    version: APP_VERSION,
    time: state.lastScan.toISOString(),
    regime: m.regime,
    btc: m.btc ? slim(m.btc) : null,
    eth: m.eth ? slim(m.eth) : null,
    gate: { closed: !!m.isDowntrend, priceDowntrend: !!m.priceDowntrend, monetaryTight: !!m.monetaryTight, stale: m.monetaryStale || null, anchor: getMonetaryAnchor() },
    covered: state.tokens.length,
    dropped: state.poolDropped,
    pool: TOP_N,
    srr, longs: byType('long'), avoid: byType('avoid'), shorts: byType('short'), watch,
    // v5.2: 全部非锚定标的的精简行情(含1h),云端按阈值筛异动
    all: state.tokens.filter(t => !isPeggedAsset(t)).map(t => ({ ...slim(t), tags: t.patterns.map(p => PATTERNS[p.code]?.name || p.code),
      // v6.0: 账本和价位提醒要用的原始字段 —— rk=成交量排名, pats=模式代码/分数/是否被否决, h7/l7=7日高低
      rk: state.tokens.indexOf(t) + 1, h7: t.high7d, l7: t.low7d,
      pats: t.patterns.map(p => ({ c: p.code, sc: p.score, v: p.vetoed ? 1 : 0 })) })),
    patTypes: Object.fromEntries(Object.entries(PATTERNS).map(([c, v]) => [c, { name: v.name, type: v.type }])),
    board: buildBoard(),
    dv: (() => { const o = {}; state.tokens.forEach(t => { const d = derivOf(t); if (d) o[t.symbol.toUpperCase()] = { fr: d.fr, oi: d.oi, dOi24: d.dOi24 ?? null, dOi1: d.dOi1 ?? null, ls: d.ls ?? null }; }); return o; })(),
    dvInfo: derivsFresh() ? { time: state.derivs.time, sources: Object.entries(state.derivs.sources || {}).filter(([k, v]) => v.ok && !k.startsWith('ls_')).map(([k]) => k), lsFrom: state.derivs.lsFrom || null } : null,
    report: state.report,
  };
}

/* ============== FILTERED ============== */
function getFiltered() {
  let arr = [...state.tokens];
  const f = state.filter;
  if (f === 'long')   arr = arr.filter(t => t.patterns.some(p => PATTERNS[p.code]?.type === 'long'));
  else if (f === 'short')  arr = arr.filter(t => t.patterns.some(p => PATTERNS[p.code]?.type === 'short'));
  else if (f === 'avoid')  arr = arr.filter(t => t.patterns.some(p => PATTERNS[p.code]?.type === 'avoid'));
  else if (f === 'watch')  arr = arr.filter(t => state.watchlist.includes(t.symbol));
  else if (f === 'tagged') arr = arr.filter(t => t.patterns.length > 0);

  const s = state.sortBy;
  if (s === 'score')          arr.sort((a, b) => b.maxScore - a.maxScore);
  else if (s === 'vol')       arr.sort((a, b) => b.volume24h - a.volume24h);
  else if (s === '24h_up')    arr.sort((a, b) => b.change24h - a.change24h);
  else if (s === '24h_down')  arr.sort((a, b) => a.change24h - b.change24h);
  else if (s === '7d_up')     arr.sort((a, b) => b.change7d - a.change7d);
  else if (s === 'rsi')       arr.sort((a, b) => a.rsi - b.rsi);
  else if (s === '1h')        arr.sort((a, b) => Math.abs(b.change1h || 0) - Math.abs(a.change1h || 0));

  return arr;
}

    `<span class="tag rose" style="background:rgba(251,113,133,0.2)">⚠${escapeHtml(w.code)}</span>`

          <div class="metric"><div class="label">距7d高</div><div class="value down">${t.high7d ? ((t.price / t.high7d - 1) * 100).toFixed(1) : '0'}%</div></div>
          ${(() => { const d = derivOf(t); return d ? `
          <div class="metric"><div class="label">费率/8h</div><div class="value ${d.fr == null ? '' : d.fr >= 0 ? 'up' : 'down'}">${fmtFr(d.fr)}</div></div>
          <div class="metric"><div class="label">费率年化</div><div class="value">${fmtFrAnn(d.fr)}</div></div>

          <div class="metric"><div class="label">距ATH</div><div class="value down">${(t.athChange || 0).toFixed(0)}%</div></div>
        </div>
        ${warningsHtml}
        ${patternsHtml || '<div style="font-size:10px;color:var(--text-faint);padding:4px 0">无v10模式匹配</div>'}
        <div class="action-row">
          <button class="action-btn ${inWl ? 'active' : ''}" onclick="event.stopPropagation();toggleWatch('${t.symbol}')">

          </button>

  }

  return `
    <div class="token-row ${isExpanded ? 'expanded' : ''}">
      <button class="token-summary" onclick="toggleExpand('${t.symbol}')">

}

// v5.1: 云端定时扫描的最近一次结果
function renderCloudBanner() {
  const c = state.cloud;
  if (!c) return '';
  const when = new Date(c.time).toLocaleString('zh-CN', { hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const btc = c.btc ? ` · BTC $${fmtPrice(c.btc.p)} (${fmtPct(c.btc.c24)})` : '';
  // v5.5: 显示云端距今多久。计划是每小时一次;超过2小时没跑,多半是GitHub的定时触发被延迟了。
  const ageMin = Math.max(0, Math.round((Date.now() - new Date(c.time).getTime()) / 60000));
  const age = ageMin < 60 ? `${ageMin}分钟前` : `${Math.floor(ageMin / 60)}小时${ageMin % 60}分前`;
  const late = ageMin > 120 ? `<span style="color:var(--amber)"> · 已超过2小时未运行(GitHub定时延迟)</span>` : '';
  return `
    <div class="cloud-banner" onclick="viewCloudReport()">
      <span>☁ 云端定时扫描 ${when}(${age}) · ${escapeHtml(c.regime || '')}${btc} · SRR ${(c.srr || []).length}${late}</span>
      <span class="cloud-link">看报告 ›</span>
    </div>`;
}

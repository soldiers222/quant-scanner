name: quant-scan

on:
  schedule:
    # 每小时一次(每个整点过7分)。GitHub 的定时任务常有十几分钟延迟,属正常。
    # 想改频率就改这一行: 每2小时 '7 */2 * * *' ; 每4小时 '7 */4 * * *'
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force_email:
        description: '不管有没有提醒都发一封邮件(测试用)'
        type: boolean
        default: true

permissions:
  contents: write   # 把扫描结果写回 data/

concurrency:
  group: quant-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: 扫描并推送邮件
        run: node cloud/scan.mjs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          CG_DEMO_KEY: ${{ secrets.CG_DEMO_KEY }}
          QS_FORCE_EMAIL: ${{ inputs.force_email && '1' || '0' }}

      - name: 保存扫描结果
        run: |
          git config user.name "quant-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push

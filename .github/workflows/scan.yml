name: quant-scan

on:
  schedule:
    # 目标是每小时扫一次。GitHub 不保证定时准点:实测(11/14-11/16)写"每小时"时,它4-8小时才触发一次。
    # 所以每10分钟给它一次触发机会,由下面"是否该扫"一步保证两次扫描至少间隔 MIN_GAP_MIN 分钟:
    # 准时 → 每小时一次;晚到 → 下一个10分钟档补上。被跳过的那几次只花十几秒。
    # 仓库是公开的,Actions 分钟数不限。如果改回私有,要把这一行改回 '7 * * * *'(私有仓库每月只有2000分钟)。
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      force_email:
        description: '不管有没有提醒都发一封邮件(测试用)'
        type: boolean
        default: true

permissions:
  contents: write   # 把扫描结果写回 data/

concurrency:
  group: quant-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIN_GAP_MIN: 55   # 两次定时扫描的最小间隔(分钟)。想每2小时扫一次就改成 115
    steps:
      - uses: actions/checkout@v4

      - name: 是否该扫
        id: gate
        run: |
          run=true
          # 定时触发、以及外部定时服务的触发(force_email=false)都受最小间隔约束;在网页上手动点的那次(默认勾选发邮件)总是执行
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name == 'workflow_dispatch' && inputs.force_email == false }}" = "true" ]; then
            last=$(jq -r '.lastRun // empty' data/state.json 2>/dev/null || true)
            if [ -n "$last" ]; then
              age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 60 ))
              echo "距上次扫描 ${age} 分钟(最小间隔 ${MIN_GAP_MIN})"
              if [ "$age" -lt "$MIN_GAP_MIN" ]; then run=false; fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.gate.outputs.run == 'true'
        run: npm ci

      - if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: 扫描并推送邮件
        if: steps.gate.outputs.run == 'true'
        run: node cloud/scan.mjs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          CG_DEMO_KEY: ${{ secrets.CG_DEMO_KEY }}
          QS_FORCE_EMAIL: ${{ inputs.force_email && '1' || '0' }}

      - name: 保存扫描结果
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "quant-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
